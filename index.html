  const categories = [
    { key: 'technique', label: '🎵 Technique', icon: '🎵' },
    { key: 'rhythm', label: '🎶 Rhythm/Timing', icon: '🎶' },
    { key: 'tone', label: '🎼 Tone/Quality', icon: '🎼' },
    { key: 'sightReading', label: '📖 Sight Reading', icon: '📖' },
    { key: 'expression', label: '🎭 Expression', icon: '🎭' },
    { key: 'focus', label: '🎯 Focus/Preparation', icon: '🎯' }
  ];

  const average = hasAssessment 
    ? (Object.values(ratings).reduce((sum, r) => sum + r, 0) / Object.values(ratings).filter(r => r > 0).length).toFixed(1)
    : null;

  function handleSave() {
    onUpdateAssessment(session.id, {
      ratingTechnique: ratings.technique || null,
      ratingRhythm: ratings.rhythm || null,
      ratingTone: ratings.tone || null,
      ratingSightReading: ratings.sightReading || null,
      ratingExpression: ratings.expression || null,
      ratingFocus: ratings.focus || null,
      assessmentNotes: notes,
      assessedAt: new Date().toISOString(),
      assessedBy: null // Will be set on backend
    });
    setEditing(false);
  }

  function handleCancel() {
    setRatings({
      technique: session.ratingTechnique || 0,
      rhythm: session.ratingRhythm || 0,
      tone: session.ratingTone || 0,
      sightReading: session.ratingSightReading || 0,
      expression: session.ratingExpression || 0,
      focus: session.ratingFocus || 0
    });
    setNotes(session.assessmentNotes || '');
    setEditing(false);
  }

  return (
    <div className="sp-section" style={{background: 'linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%)', border: '2px solid var(--accent)'}}>
      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem'}}>
        <div style={{display: 'flex', alignItems: 'center', gap: '1rem'}}>
          <div className="sp-section-title" style={{margin: 0, fontSize: '.9rem'}}>
            ⭐ SESSION ASSESSMENT
          </div>
          {average && !editing && (
            <div style={{
              background: '#FFB800',
              color: '#000',
              padding: '.3rem .75rem',
              borderRadius: '20px',
              fontSize: '.85rem',
              fontWeight: 600
            }}>
              Average: {average} / 5.0
            </div>
          )}
        </div>
        {isTutorAdmin && !editing && (
          <button className="btn btn-sm btn-primary" onClick={() => setEditing(true)}>
            {hasAssessment ? 'Edit Assessment' : 'Add Assessment'}
          </button>
        )}
      </div>

      {!hasAssessment && !editing ? (
        <div style={{
          padding: '2rem',
          textAlign: 'center',
          color: 'var(--text3)',
          fontSize: '.9rem'
        }}>
          {isTutorAdmin 
            ? '📊 No assessment yet. Click "Add Assessment" to rate this session.' 
            : '📊 Tutor has not added an assessment for this session yet.'}
        </div>
      ) : (
        <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
          {/* Rating Grid */}
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))',
            gap: '1rem'
          }}>
            {categories.map(cat => (
              <div key={cat.key} style={{
                background: 'var(--bg1)',
                padding: '.75rem 1rem',
                borderRadius: '8px',
                border: '1px solid var(--border)'
              }}>
                <div style={{
                  fontSize: '.85rem',
                  fontWeight: 500,
                  color: 'var(--text2)',
                  marginBottom: '.5rem'
                }}>
                  {cat.label}
                </div>
                <StarRating
                  rating={ratings[cat.key]}
                  onChange={(value) => setRatings({...ratings, [cat.key]: value})}
                  readOnly={!editing}
                />
              </div>
            ))}
          </div>

          {/* Assessment Notes */}
          <div>
            <div style={{fontSize: '.85rem', fontWeight: 500, color: 'var(--text2)', marginBottom: '.5rem'}}>
              Assessment Notes
            </div>
            {editing ? (
              <textarea
                value={notes}
                onChange={e => setNotes(e.target.value)}
                placeholder="Add detailed feedback about the student's performance..."
                style={{
                  width: '100%',
                  background: 'var(--bg1)',
                  border: '1px solid var(--border2)',
                  borderRadius: '6px',
                  color: 'var(--text)',
                  padding: '1rem',
                  minHeight: '100px',
                  fontSize: '.92rem',
                  resize: 'vertical'
                }}
              />
            ) : (
              <div style={{
                background: 'var(--bg1)',
                padding: '1rem',
                borderRadius: '6px',
                border: '1px solid var(--border)',
                fontSize: '.92rem',
                color: 'var(--text2)',
                minHeight: '60px'
              }}>
                {notes || <span style={{fontStyle: 'italic', color: 'var(--text3)'}}>No notes added</span>}
              </div>
            )}
          </div>

          {/* Action Buttons */}
          {editing && (
            <div style={{display: 'flex', gap: '.5rem', justifyContent: 'flex-end'}}>
              <button className="btn btn-sm" onClick={handleCancel}>Cancel</button>
              <button className="btn btn-sm btn-primary" onClick={handleSave}>Save Assessment</button>
            </div>
          )}

          {/* Timestamp */}
          {session.assessedAt && !editing && (
            <div style={{fontSize: '.75rem', color: 'var(--text3)', textAlign: 'right'}}>
              Last assessed: {new Date(session.assessedAt).toLocaleString('en-AU')}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   SESSION DETAIL PANEL
══════════════════════════════════════════════════ */
function SessionPanel({ session, userRole, currentUserId, onClose, onSaveRecording, onUpdateSession, onMarkStatus, onSendReminder }) {
  const [editingTutorComment,   setEditTC]    = useState(false);
  const [editingStudentComment, setEditSC]    = useState(false);
  const [tutorComment,  setTutorComment]      = useState(session.tutorComments);
  const [studentComment,setStudentComment]    = useState(session.studentComments);
  const [editingSummary, setEditSummary]      = useState(false);
  const [summary, setSummary]                 = useState(session.plannedSummary);
  const [sendingReminder, setSendingReminder] = useState(false);

  const isCompleted  = session.status === 'attended';
  const isScheduled  = session.status === 'scheduled';
  const isTutorAdmin = userRole === 'tutor' || userRole === 'admin';
  const isStudent    = userRole === 'student';
  const isParent     = userRole === 'parent';

  const student = USERS.find(u => u.id === session.studentId);
  const tutor   = USERS.find(u => u.id === session.tutorId);

  function saveTutorComment() {
    onUpdateSession(session.id, { tutorComments: tutorComment });
    setEditTC(false);
  }
  function saveStudentComment() {
    onUpdateSession(session.id, { studentComments: studentComment });
    setEditSC(false);
  }
  function saveSummary() {
    onUpdateSession(session.id, { plannedSummary: summary });
    setEditSummary(false);
  }

  return (
    <>
      <div className="session-panel-overlay" onClick={onClose}/>
      <div className="session-panel">
        <div className="sp-hdr">
          <div>
            <h3>{fmtDate(session.date)}</h3>
            <div style={{marginTop:'.3rem',display:'flex',gap:'.5rem',alignItems:'center',flexWrap:'wrap'}}>
              <span className={statusClass(session.status)}>{session.status}</span>
              <span style={{fontSize:'.82rem',color:'var(--text3)'}}>{fmtTime(session.startTime)} – {fmtTime(session.endTime)}</span>
              <span style={{fontSize:'.82rem',color:'var(--text3)'}}>{session.durationMin} min</span>
            </div>
          </div>
          <button className="btn btn-sm" onClick={onClose}>✕</button>
        </div>

        <div className="sp-body">

          {/* ── Session Info ── */}
          <div className="sp-section">
            <div className="sp-section-title">Session Details</div>
            <div className="sp-row"><span className="sp-lbl">Student</span><span className="sp-val">{student?.name}</span></div>
            <div className="sp-row"><span className="sp-lbl">Tutor</span><span className="sp-val">{tutor?.name}</span></div>
            <div className="sp-row"><span className="sp-lbl">Instrument</span><span className="sp-val">{session.instrument}</span></div>
            {session.accompaniment && <div className="sp-row"><span className="sp-lbl">Accompaniment</span><span className="sp-val">{session.accompaniment}</span></div>}
          </div>

          {/* ── Assessment Section (PROMINENT) ── */}
          {(isCompleted || (isTutorAdmin && isScheduled)) && (
            <AssessmentSection
              session={session}
              userRole={userRole}
              onUpdateAssessment={onUpdateSession}
            />
          )}

          {/* ── Recordings Section ── */}
          <RecordingsList
            sessionId={session.id}
            userRole={userRole}
            currentUserId={currentUserId}
          />

          {/* ── Session Summary (scheduled & completed) ── */}
          <div className="sp-section">
            <div className="sp-section-title" style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.6rem'}}>
              {isCompleted ? 'Session Summary' : 'Planned Session'}
              {isTutorAdmin && !editingSummary && (
                <button className="btn btn-sm" onClick={() => setEditSummary(true)}>Edit</button>
              )}
            </div>
            {editingSummary ? (
              <div>
                <textarea className="field" style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:6,color:'var(--text)',padding:'1rem',minHeight:120,fontSize:'.92rem'}}
                  value={summary} onChange={e=>setSummary(e.target.value)}/>
                <div style={{display:'flex',gap:'.5rem',marginTop:'.5rem'}}>
                  <button className="btn btn-sm btn-primary" onClick={saveSummary}>Save</button>
                  <button className="btn btn-sm" onClick={()=>{setSummary(session.plannedSummary);setEditSummary(false);}}>Cancel</button>
                </div>
              </div>
            ) : (
              <p className="sp-comment">{session.plannedSummary || <span className="sp-empty">No summary entered yet.</span>}</p>
            )}
          </div>

          {/* ── Tutor Comments (completed only) ── */}
          {isCompleted && (
            <div className="sp-section">
              <div className="sp-section-title" style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.6rem'}}>
                Tutor Comments
                {isTutorAdmin && !editingTutorComment && (
                  <button className="btn btn-sm" onClick={()=>setEditTC(true)}>Edit</button>
                )}
              </div>
              {editingTutorComment ? (
                <div>
                  <textarea style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:6,color:'var(--text)',padding:'1rem',minHeight:120,fontSize:'.92rem',resize:'vertical'}}
                    value={tutorComment} onChange={e=>setTutorComment(e.target.value)}/>
                  <div style={{display:'flex',gap:'.5rem',marginTop:'.5rem'}}>
                    <button className="btn btn-sm btn-primary" onClick={saveTutorComment}>Save</button>
                    <button className="btn btn-sm" onClick={()=>{setTutorComment(session.tutorComments);setEditTC(false);}}>Cancel</button>
                  </div>
                </div>
              ) : (
                <p className="sp-comment">{session.tutorComments || <span className="sp-empty">No comments yet.</span>}</p>
              )}
            </div>
          )}

          {/* ── Student Comments (scheduled & completed) ── */}
          {(isScheduled || isCompleted) && (
            <div className="sp-section">
              <div className="sp-section-title" style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.6rem'}}>
                {isScheduled ? 'Practice Notes' : 'Student Comments'}
                {(isStudent || isTutorAdmin) && !editingStudentComment && (
                  <button className="btn btn-sm" onClick={()=>setEditSC(true)}>Edit</button>
                )}
              </div>
              {editingStudentComment ? (
                <div>
                  <textarea style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:6,color:'var(--text)',padding:'1rem',minHeight:120,fontSize:'.92rem',resize:'vertical'}}
                    value={studentComment} onChange={e=>setStudentComment(e.target.value)}
                    placeholder={isScheduled ? "Add practice notes before your lesson..." : "Add your thoughts about this lesson..."}
                  />
                  <div style={{display:'flex',gap:'.5rem',marginTop:'.5rem'}}>
                    <button className="btn btn-sm btn-primary" onClick={saveStudentComment}>Save</button>
                    <button className="btn btn-sm" onClick={()=>{setStudentComment(session.studentComments);setEditSC(false);}}>Cancel</button>
                  </div>
                </div>
              ) : (
                <p className="sp-comment">{session.studentComments || <span className="sp-empty">{isScheduled ? 'No practice notes yet.' : 'No student comments yet.'}</span>}</p>
              )}
            </div>
          )}

          {/* ── Recordings ── */}
          <div className="sp-section">
            <div className="sp-section-title" style={{marginBottom:'.75rem'}}>
              {isCompleted ? 'Session Recordings' : 'Practice Recordings (Homework)'}
            </div>
            <RecordingSection
              session={session}
              canRecord={!isParent}
              userRole={userRole}
              onSaveRecording={onSaveRecording}
            />
          </div>

          {/* ── Status controls (tutor/admin, upcoming) ── */}
          {isTutorAdmin && (
            <div className="sp-section">
              <div className="sp-section-title" style={{marginBottom:'.75rem'}}>Mark Attendance</div>
              <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap'}}>
                {['attended','missed','scheduled','cancelled'].map(s => (
                  <button key={s} className={`btn btn-sm btn-${s==='attended'?'green':s==='missed'?'red':s==='scheduled'?'blue':'amber'}`}
                    style={{opacity:session.status===s?.8:1}}
                    onClick={() => onMarkStatus(session.id, s)}>
                    {s.charAt(0).toUpperCase()+s.slice(1)}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* ── Send Reminder SMS (tutor/admin, scheduled only) ── */}
          {isTutorAdmin && isScheduled && onSendReminder && (
            <div className="sp-section">
              <div className="sp-section-title" style={{marginBottom:'.75rem'}}>SMS Reminder</div>
              <button 
                className="btn btn-sm btn-primary" 
                onClick={async () => {
                  setSendingReminder(true);
                  await onSendReminder(session);
                  setSendingReminder(false);
                }}
                disabled={sendingReminder}
                style={{opacity: sendingReminder ? 0.6 : 1}}
              >
                {sendingReminder ? '📤 Sending...' : '📱 Send Reminder SMS'}
              </button>
              <p style={{fontSize:'.82rem',color:'var(--text3)',marginTop:'.5rem'}}>
                Sends "Your lesson starts in 2 hours" reminder to student/parent
              </p>
            </div>
          )}

        </div>
      </div>
    </>
  );
}

/* ══════════════════════════════════════════════════
   CALENDAR COMPONENT
══════════════════════════════════════════════════ */
function AttendanceCalendar({ sessions, userRole, currentUserId, filterStudentIds, onSelectSession }) {
  const todayDate = new Date();
  const [date, setDate] = useState(new Date());
  const [flyoutDate, setFlyoutDate] = useState(null); // Track which day's flyout is open

  const year = date.getFullYear(), month = date.getMonth();
  
  // Close flyout on ESC key
  useEffect(() => {
    function handleEscape(e) {
      if (e.key === 'Escape' && flyoutDate) {
        closeFlyout();
      }
    }
    window.addEventListener('keydown', handleEscape);
    return () => window.removeEventListener('keydown', handleEscape);
  }, [flyoutDate]);

  // build day → sessions map
  const dayMap = {};
  sessions.forEach(s => {
    if (!dayMap[s.date]) dayMap[s.date] = [];
    dayMap[s.date].push(s);
  });

  // dominant status for cell
  function dominant(recs) {
    if (recs.some(r=>r.status==='attended'))  return 'attended';
    if (recs.some(r=>r.status==='missed'))    return 'missed';
    if (recs.some(r=>r.status==='cancelled')) return 'cancelled';
    if (recs.some(r=>r.status==='scheduled')) return 'scheduled';
    return null;
  }

  function handleDayClick(recs, dateStr, event) {
    if (recs.length === 0) return;
    
    // If flyout is currently open, close it and don't open anything else
    // User needs to click again to open the session
    if (flyoutDate) {
      closeFlyout();
      return;
    }
    
    if (recs.length === 1) {
      // Single session - open directly
      onSelectSession(recs[0]);
    } else {
      // Multiple sessions - show flyout in top-right
      setFlyoutDate(dateStr);
    }
  }

  function closeFlyout() {
    setFlyoutDate(null);
  }

  const firstDay    = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // stats
  const monthSessions = sessions.filter(s => {
    const [y,m] = s.date.split('-').map(Number);
    return y===year && m-1===month;
  });
  const att  = monthSessions.filter(s=>s.status==='attended').length;
  const miss = monthSessions.filter(s=>s.status==='missed').length;
  const sch  = monthSessions.filter(s=>s.status==='scheduled').length;
  const can  = monthSessions.filter(s=>s.status==='cancelled').length;
  const total = att + miss;
  const rate  = total > 0 ? Math.round(att/total*100) : null;

  const cells = [];
  for (let i=0; i<firstDay; i++) cells.push({type:'blank',key:'b'+i});
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const recs    = dayMap[dateStr] || [];
    const dom     = dominant(recs);
    const isToday = dateStr === TODAY;
    cells.push({ type:'day', key:dateStr, day:d, dateStr, recs, dom, isToday });
  }

  const flyoutSessions = flyoutDate ? (dayMap[flyoutDate] || []) : [];

  return (
    <div className="cal-wrap">
      <div className="cal-toolbar">
        <div className="cal-nav">
          <button className="cal-nav-btn" onClick={()=>setDate(new Date(year,month-1,1))}>‹</button>
          <div className="cal-month">{MONTHS[month]} {year}</div>
          <button className="cal-nav-btn" onClick={()=>setDate(new Date(year,month+1,1))}>›</button>
          <button 
            className="btn btn-sm" 
            onClick={()=>setDate(new Date())}
            style={{marginLeft:'.5rem',fontSize:'.85rem',padding:'.3rem .7rem'}}
          >
            Today
          </button>
        </div>
        <div className="cal-stats">
          {att  > 0 && <div className="cal-stat"><div className="dot dot-green"/><b>{att}</b> attended</div>}
          {miss > 0 && <div className="cal-stat"><div className="dot dot-red"/><b>{miss}</b> missed</div>}
          {sch  > 0 && <div className="cal-stat"><div className="dot dot-blue"/><b>{sch}</b> upcoming</div>}
          {can  > 0 && <div className="cal-stat"><div className="dot dot-amber"/><b>{can}</b> cancelled</div>}
          {rate !== null && (
            <div className={`rate-pill${rate>=80?'':rate>=60?' rate-ok':' rate-poor'}`}>
              Attendance <b>{rate}%</b>
            </div>
          )}
        </div>
      </div>

      <div className="cal-grid">
        {WDAYS.map(d=><div key={d} className="cal-day-hdr">{d}</div>)}
        {cells.map(cell => {
          if (cell.type==='blank') return <div key={cell.key} className="cal-cell other-month"/>;
          const { key, day, recs, dom, isToday, dateStr } = cell;
          let cls = 'cal-cell';
          if (dom) cls += ` has-${dom}`;
          if (isToday) cls += ' today';

          return (
            <div key={key} className={cls} onClick={(e) => handleDayClick(recs, dateStr, e)}>
              <div className="cal-day-num">{day}</div>
              {recs.length > 0 && (
                <div className="cal-pips">
                  {recs.slice(0,6).map((r,i) => (
                    <div key={i} className="cal-pip" style={{background:statusColor(r.status)}}/>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Flyout Menu for Multiple Sessions */}
      {flyoutDate && flyoutSessions.length > 1 && (
        <>
          {/* Backdrop overlay */}
          <div 
            style={{
              position: 'fixed',
              top: 0,
              left: 0,
              right: 0,
              bottom: 0,
              background: 'rgba(0, 0, 0, 0.5)',
              zIndex: 100
            }}
            onClick={closeFlyout}
          />
          {/* Flyout content */}
          <div
            style={{
              position: 'fixed',
              right: '2rem',
              top: '6rem',
              background: 'var(--bg1)',
              border: '2px solid var(--accent)',
              borderRadius: '8px',
              boxShadow: '0 4px 20px rgba(0,0,0,0.3)',
              padding: '0',
              zIndex: 101,
              minWidth: '320px',
              maxWidth: '450px',
              maxHeight: 'calc(100vh - 8rem)',
              overflowY: 'auto'
            }}
            onClick={e => e.stopPropagation()}
          >
            {/* Header with close button */}
            <div style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              fontSize: '.85rem',
              fontWeight: 600,
              color: 'var(--text2)',
              padding: '.75rem 1rem',
              borderBottom: '1px solid var(--border)',
              position: 'sticky',
              top: 0,
              background: 'var(--bg1)',
              zIndex: 1
            }}>
              <span>{fmtDate(flyoutDate)} — {flyoutSessions.length} Sessions</span>
              <button 
                onClick={closeFlyout}
                style={{
                  background: 'none',
                  border: 'none',
                  color: 'var(--text2)',
                  fontSize: '1.2rem',
                  cursor: 'pointer',
                  padding: '0',
                  width: '24px',
                  height: '24px',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  borderRadius: '4px',
                  transition: 'background 0.2s'
                }}
                onMouseEnter={e => e.currentTarget.style.background = 'var(--bg3)'}
                onMouseLeave={e => e.currentTarget.style.background = 'none'}
                title="Close (ESC or click outside)"
              >
                ✕
              </button>
            </div>
            {flyoutSessions.sort((a,b) => a.startTime.localeCompare(b.startTime)).map((session, idx) => {
              const student = USERS.find(u => u.id === session.studentId);
              const tutor = USERS.find(u => u.id === session.tutorId);
              
              return (
                <div
                  key={session.id}
                  style={{
                    padding: '.75rem',
                    cursor: 'pointer',
                    borderBottom: idx < flyoutSessions.length - 1 ? '1px solid var(--border)' : 'none',
                    transition: 'background 0.2s'
                  }}
                  onMouseEnter={e => e.currentTarget.style.background = 'var(--bg2)'}
                  onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                  onClick={() => {
                    onSelectSession(session);
                    closeFlyout();
                  }}
                >
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '.3rem'}}>
                    <span style={{fontSize: '.9rem', fontWeight: 500, color: 'var(--text)'}}>
                      {fmtTime(session.startTime)} - {fmtTime(session.endTime)}
                    </span>
                    <span className={statusClass(session.status)}>{session.status}</span>
                  </div>
                  <div style={{fontSize: '.85rem', color: 'var(--text2)'}}>
                    {student?.name} • {session.instrument} • {tutor?.name}
                  </div>
                </div>
              );
            })}
            {/* Hint text */}
            <div style={{
              padding: '.5rem .75rem',
              fontSize: '.75rem',
              color: 'var(--text3)',
              textAlign: 'center',
              borderTop: '1px solid var(--border)',
              background: 'var(--bg2)'
            }}>
              Click session to view details • ESC or click outside to close
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   SCHEDULE SESSION MODAL (tutor / admin)
══════════════════════════════════════════════════ */
function ScheduleModal({ onClose, onSave, currentUserId, userRole, sessions }) {
  const students = USERS.filter(u=>u.role==='student');
  const tutors   = USERS.filter(u=>u.role==='tutor');
  const [form, setForm] = useState({
    studentId: students[0]?.id || '',
    tutorId:   userRole==='tutor' ? currentUserId : (tutors[0]?.id || ''),
    date:      TODAY,
    startTime: '09:00',
    durationMin: 30,
    instrument: 'Piano',
    accompaniment: '',
    plannedSummary: ''
  });

  function calcEnd(start, mins) {
    if (!start) return '';
    const [h,m] = start.split(':').map(Number);
    const total = h*60+m+parseInt(mins);
    return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
  }

  function handleSave() {
    // Validate date+time is not in the past
    const now = new Date();
    const selectedDateTime = new Date(`${form.date}T${form.startTime}`);
    
    if (selectedDateTime < now) {
      alert('Cannot book sessions in the past. Please select a future date and time.');
      return;
    }
    
    // Check for tutor time conflicts
    const endTime = calcEnd(form.startTime, form.durationMin);
    const conflict = sessions?.find(s => {
      if (s.tutorId !== parseInt(form.tutorId)) return false;
      if (s.date !== form.date) return false;
      if (s.status === 'cancelled') return false;
      
      // Check if times overlap
      const existingStart = s.startTime;
      const existingEnd = s.endTime;
      
      // Overlap if: new starts before existing ends AND new ends after existing starts
      const overlap = (form.startTime < existingEnd) && (endTime > existingStart);
      return overlap;
    });
    
    if (conflict) {
      const conflictTutor = USERS.find(u => u.id === conflict.tutorId);
      const conflictStudent = USERS.find(u => u.id === conflict.studentId);
      alert(`⚠️ TIME CONFLICT!\n\n${conflictTutor?.name} already has a session with ${conflictStudent?.name} at ${fmtTime(conflict.startTime)} - ${fmtTime(conflict.endTime)} on this date.\n\nPlease choose a different time.`);
      return;
    }
    
    onSave({
      id: 's'+Date.now(),
      studentId: parseInt(form.studentId),
      tutorId:   parseInt(form.tutorId),
      date:      form.date,
      startTime: form.startTime,
      endTime,
      durationMin: parseInt(form.durationMin),
      instrument:    form.instrument,
      accompaniment: form.accompaniment,
      status: 'scheduled',
      plannedSummary: form.plannedSummary,
      tutorComments: '', studentComments: '',
      recordings: [],
      payrollTutorPaid:false, paymentReceived:false, invoiced:false
    });
    onClose();
  }

  const f = (field, val) => setForm(p=>({...p,[field]:val}));

  return (
    <div className="modal-overlay">
      <div className="modal-box">
        <div className="modal-hdr">
          <h3>Schedule New Session</h3>
          <button className="btn btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="field">
            <label>Student</label>
            <select value={form.studentId} onChange={e=>f('studentId',e.target.value)}>
              {students.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Tutor</label>
            <select value={form.tutorId} onChange={e=>f('tutorId',e.target.value)} disabled={userRole==='tutor'}>
              {tutors.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}>
            <div className="field">
              <label>Date</label>
              <select value={form.date} onChange={e=>f('date',e.target.value)}>
                {Array.from({length: 60}, (_, i) => {
                  const d = new Date();
                  d.setDate(d.getDate() + i);
                  const dateStr = d.toISOString().split('T')[0];
                  const display = d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                  return <option key={dateStr} value={dateStr}>{display}</option>;
                })}
              </select>
            </div>
            <div className="field">
              <label>Start Time</label>
              <select value={form.startTime} onChange={e=>f('startTime',e.target.value)}>
                {['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30','20:00'].map(t => (
                  <option key={t} value={t}>{t.replace(/^(\d+):(\d+)$/, (m,h,min) => {
                    const hr = parseInt(h);
                    return `${hr > 12 ? hr-12 : hr === 0 ? 12 : hr}:${min}${hr >= 12 ? 'pm' : 'am'}`;
                  })}</option>
                ))}
              </select>
            </div>
          </div>
          <div className="field">
            <label>Duration</label>
            <select value={form.durationMin} onChange={e=>f('durationMin',e.target.value)}>
              <option value={30}>30 minutes</option>
              <option value={45}>45 minutes</option>
              <option value={60}>60 minutes</option>
            </select>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}>
            <div className="field">
              <label>Instrument</label>
              <input value={form.instrument} onChange={e=>f('instrument',e.target.value)} placeholder="Piano, Guitar…"/>
            </div>
            <div className="field">
              <label>Accompaniment</label>
              <input value={form.accompaniment} onChange={e=>f('accompaniment',e.target.value)} placeholder="Bio backing, none…"/>
            </div>
          </div>
          <div className="field">
            <label>Planned Session Summary</label>
            <textarea value={form.plannedSummary} onChange={e=>f('plannedSummary',e.target.value)} placeholder="What to expect, focus areas, materials to bring…"/>
          </div>
          <div style={{fontSize:'.8rem',color:'var(--text3)',marginTop:'-.5rem'}}>
            End time: <strong style={{color:'var(--text2)'}}>{fmtTime(calcEnd(form.startTime,form.durationMin))}</strong>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave}>Schedule Session</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   BROADCAST SMS MODAL
══════════════════════════════════════════════════ */
function BroadcastModal({ onClose, onSend }) {
  const [message, setMessage] = useState('');
  const [recipientType, setRecipientType] = useState('all_students'); // 'all_students' | 'all_parents' | 'all_users'
  const [sending, setSending] = useState(false);
  const [progress, setProgress] = useState({ current: 0, total: 0 });

  // Calculate recipients
  const students = USERS.filter(u => u.role === 'student');
  const parents = USERS.filter(u => u.role === 'parent');
  const allUsers = [...students, ...parents];
  
  const recipients = recipientType === 'all_students' ? students :
                     recipientType === 'all_parents' ? parents : allUsers;
  
  const recipientsWithMobiles = recipients.filter(u => u.mobile);
  
  async function handleSend() {
    if (!message.trim()) {
      alert('Please enter a message');
      return;
    }
    
    if (!confirm(`Send SMS to ${recipientsWithMobiles.length} recipients?\n\nThis will use Twilio credits.`)) {
      return;
    }
    
    setSending(true);
    setProgress({ current: 0, total: recipientsWithMobiles.length });
    
    const results = await onSend(message, recipientsWithMobiles, (current, total) => {
      setProgress({ current, total });
    });
    
    setSending(false);
    
    const successCount = results.filter(r => r.success).length;
    const failCount = results.filter(r => !r.success).length;
    
    alert(`✓ Broadcast complete!\n\n✅ Sent: ${successCount}\n❌ Failed: ${failCount}\n\nCheck sms_log table for details.`);
    onClose();
  }

  return (
    <div className="modal-overlay">
      <div className="modal-box" style={{maxWidth:'600px'}}>
        <div className="modal-hdr">
          <h3>📢 Broadcast SMS</h3>
          <button className="btn btn-sm" onClick={onClose} disabled={sending}>✕</button>
        </div>
        <div className="modal-body">
          <div className="field">
            <label>Recipients</label>
            <select value={recipientType} onChange={e=>setRecipientType(e.target.value)} disabled={sending}>
              <option value="all_students">All Students ({students.filter(u=>u.mobile).length} with mobiles)</option>
              <option value="all_parents">All Parents ({parents.filter(u=>u.mobile).length} with mobiles)</option>
              <option value="all_users">All Students + Parents ({allUsers.filter(u=>u.mobile).length} with mobiles)</option>
            </select>
          </div>
          
          <div className="field">
            <label>Message</label>
            <textarea 
              value={message} 
              onChange={e=>setMessage(e.target.value)}
              placeholder="Type your broadcast message here..."
              disabled={sending}
              style={{minHeight:'120px'}}
            />
            <div style={{fontSize:'.8rem',color:'var(--text3)',marginTop:'.3rem'}}>
              {message.length} characters • Will send to {recipientsWithMobiles.length} recipients
            </div>
          </div>
          
          {recipientsWithMobiles.length < recipients.length && (
            <div style={{padding:'.75rem',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:'6px',fontSize:'.85rem',color:'var(--text3)'}}>
              ⚠️ Note: {recipients.length - recipientsWithMobiles.length} {recipientType === 'all_students' ? 'students' : recipientType === 'all_parents' ? 'parents' : 'users'} have no mobile number and will be skipped.
            </div>
          )}
          
          {sending && (
            <div style={{padding:'1rem',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:'6px'}}>
              <div style={{fontSize:'.9rem',color:'var(--text2)',marginBottom:'.5rem'}}>
                📤 Sending... {progress.current} / {progress.total}
              </div>
              <div style={{background:'var(--bg2)',height:'8px',borderRadius:'4px',overflow:'hidden'}}>
                <div style={{
                  background:'var(--accent)',
                  height:'100%',
                  width:`${progress.total > 0 ? (progress.current / progress.total * 100) : 0}%`,
                  transition:'width 0.3s ease'
                }}/>
              </div>
            </div>
          )}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose} disabled={sending}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSend} disabled={sending || !message.trim()}>
            {sending ? '📤 Sending...' : '📢 Send Broadcast'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   BROADCAST EMAIL MODAL
══════════════════════════════════════════════════ */
function BroadcastEmailModal({ onClose, adminEmail }) {
  const [subject, setSubject] = useState('');
  const [message, setMessage] = useState('');
  const [recipientType, setRecipientType] = useState('all_students'); // 'all_students' | 'all_parents' | 'all_users'

  // Calculate recipients
  const students = USERS.filter(u => u.role === 'student');
  const parents = USERS.filter(u => u.role === 'parent');
  const allUsers = [...students, ...parents];
  
  const recipients = recipientType === 'all_students' ? students :
                     recipientType === 'all_parents' ? parents : allUsers;
  
  const recipientsWithEmails = recipients.filter(u => u.email);
  
  function handleSend() {
    if (!subject.trim() || !message.trim()) {
      alert('Please enter both subject and message');
      return;
    }
    
    // Create mailto link: To = admin (for receipt), BCC = all recipients
    const emailList = recipientsWithEmails.map(u => u.email).join(',');
    const encodedSubject = encodeURIComponent(subject);
    const encodedBody = encodeURIComponent(message);
    
    // Address to admin for receipt, BCC everyone else
    const mailtoLink = `mailto:${adminEmail}?bcc=${emailList}&subject=${encodedSubject}&body=${encodedBody}`;
    
    window.location.href = mailtoLink;
    
    alert(`✓ Opening your email client.\n\nTo: You (${adminEmail})\nBCC: ${recipientsWithEmails.length} recipients\n\nYou'll receive a copy as confirmation that the broadcast was sent.`);
    onClose();
  }

  return (
    <div className="modal-overlay">
      <div className="modal-box" style={{maxWidth:'600px'}}>
        <div className="modal-hdr">
          <h3>📧 Broadcast Email</h3>
          <button className="btn btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="field">
            <label>Recipients</label>
            <select value={recipientType} onChange={e=>setRecipientType(e.target.value)}>
              <option value="all_students">All Students ({students.filter(u=>u.email).length} with emails)</option>
              <option value="all_parents">All Parents ({parents.filter(u=>u.email).length} with emails)</option>
              <option value="all_users">All Students + Parents ({allUsers.filter(u=>u.email).length} with emails)</option>
            </select>
          </div>
          
          <div className="field">
            <label>Subject</label>
            <input 
              type="text"
              value={subject} 
              onChange={e=>setSubject(e.target.value)}
              placeholder="Email subject line..."
            />
          </div>
          
          <div className="field">
            <label>Message</label>
            <textarea 
              value={message} 
              onChange={e=>setMessage(e.target.value)}
              placeholder="Type your email message here..."
              style={{minHeight:'150px'}}
            />
            <div style={{fontSize:'.8rem',color:'var(--text3)',marginTop:'.3rem'}}>
              {message.length} characters • Will email {recipientsWithEmails.length} recipients (BCC)
            </div>
          </div>
          
          {recipientsWithEmails.length < recipients.length && (
            <div style={{padding:'.75rem',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:'6px',fontSize:'.85rem',color:'var(--text3)'}}>
              ⚠️ Note: {recipients.length - recipientsWithEmails.length} {recipientType === 'all_students' ? 'students' : recipientType === 'all_parents' ? 'parents' : 'users'} have no email address and will be skipped.
            </div>
          )}
          
          <div style={{padding:'.75rem',background:'var(--bg3)',border:'1px solid var(--accent)',borderRadius:'6px',fontSize:'.85rem',color:'var(--text2)'}}>
            💡 <b>How it works:</b> The email will be addressed to YOU with all recipients in BCC (hidden). This way you get a copy as confirmation the broadcast was sent, and recipients' privacy is protected.
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSend} disabled={!subject.trim() || !message.trim()}>
            📧 Open Email Client
          </button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   ADMIN DAY VIEW (accordion by tutor)
══════════════════════════════════════════════════ */
function TutorRoster({ sessions, currentUserId, userRole }) {
  const tutors = USERS.filter(u => u.role === 'tutor');
  const visibleTutors = userRole === 'tutor'
    ? tutors.filter(t => t.id === currentUserId)
    : tutors;

  // Dynamic date range - default to current month
  const today = new Date();
  const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const lastDayOfMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  
  const [selectedTutor, setSelectedTutor] = useState(
    userRole === 'tutor' ? currentUserId : null
  );
  const [fromDate, setFromDate] = useState(firstDayOfMonth.toISOString().slice(0, 10));
  const [toDate,   setToDate]   = useState(lastDayOfMonth.toISOString().slice(0, 10));
  const [openDays, setOpenDays] = useState({});

  function toggleDay(d) { setOpenDays(p => ({...p, [d]: p[d]===false ? true : false})); }

  const tutorSessions = selectedTutor
    ? sessions.filter(s =>
        s.tutorId === selectedTutor &&
        s.date >= fromDate &&
        s.date <= toDate
      ).sort((a,b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime))
    : [];

  const WORK_START = '08:30';
  const WORK_END   = '17:00';

  function timeToMins(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }
  function minsToTime(m) { return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }

  function getDatesInRange(from, to) {
    const dates = [];
    let cur = new Date(from + 'T00:00:00');
    const end = new Date(to + 'T00:00:00');
    while (cur <= end) {
      const wd = cur.getDay();
      if (wd !== 0 && wd !== 6) dates.push(cur.toISOString().slice(0,10));
      cur.setDate(cur.getDate() + 1);
    }
    return dates;
  }

  const allDates = getDatesInRange(fromDate, toDate);

  function buildDaySlots(date) {
    const daySessions = tutorSessions.filter(s => s.date === date)
      .sort((a,b) => a.startTime.localeCompare(b.startTime));
    const slots = [];
    let cursor = timeToMins(WORK_START);
    daySessions.forEach(s => {
      const sStart = timeToMins(s.startTime);
      const sEnd   = timeToMins(s.endTime);
      if (sStart > cursor + 14) {
        slots.push({ type:'gap', startTime:minsToTime(cursor), endTime:s.startTime, durationMin:sStart-cursor });
      }
      slots.push({ type:'booked', session:s, startTime:s.startTime, endTime:s.endTime, durationMin:s.durationMin, status:s.status });
      cursor = sEnd;
    });
    const workEnd = timeToMins(WORK_END);
    if (workEnd > cursor + 14) {
      slots.push({ type:'gap', startTime:minsToTime(cursor), endTime:WORK_END, durationMin:workEnd-cursor });
    }
    return { daySessions, slots };
  }

  function tutorStats(tid) {
    const ts = sessions.filter(s => s.tutorId === tid);
    return {
      upcoming: ts.filter(s=>s.status==='scheduled').length,
      attended: ts.filter(s=>s.status==='attended').length,
      students: new Set(ts.map(s=>s.studentId)).size
    };
  }

  const selectedTutorObj = tutors.find(t => t.id === selectedTutor);

  return (
    <div className="roster-wrap">
      {userRole !== 'tutor' && (
        <div className="roster-tutor-list">
          {visibleTutors.map(t => {
            const st = tutorStats(t.id);
            return (
              <div key={t.id}
                className={`roster-tutor-card${selectedTutor===t.id?' active':''}`}
                onClick={() => setSelectedTutor(selectedTutor===t.id ? null : t.id)}>
                <div className="rtc-name"><span className="rtc-dot"/>{t.name}</div>
                <div className="rtc-meta">
                  <span>{st.students} students</span>
                  <span>{st.upcoming} upcoming</span>
                  <span>{st.attended} taught</span>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {selectedTutor && (
        <div className="roster-detail">
          <div className="roster-detail-hdr">
            <h3>{selectedTutorObj?.name} — Schedule</h3>
            <div className="roster-range">
              <label>From</label>
              <input type="date" value={fromDate} onChange={e=>setFromDate(e.target.value)}/>
              <label>To</label>
              <input type="date" value={toDate} onChange={e=>setToDate(e.target.value)}/>
            </div>
          </div>

          {allDates.map(date => {
            const { daySessions, slots } = buildDaySlots(date);
            const hasGap   = slots.some(s=>s.type==='gap');
            const isFreeDay= daySessions.length === 0;
            const isOpen   = openDays[date] !== false;
            const dateObj  = new Date(date+'T00:00:00');
            const dayLabel = dateObj.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
            const gapCount = slots.filter(s=>s.type==='gap').length;

            return (
              <div key={date} className="roster-day-row">
                <div className="roster-day-hdr" onClick={()=>toggleDay(date)}>
                  <span className={`roster-day-date${(hasGap||isFreeDay)?' has-gap':''}`}>
                    {dayLabel}
                    {isFreeDay && ' ✦ Free Day'}
                    {!isFreeDay && hasGap && ' ✦ Has Openings'}
                  </span>
                  <div className="roster-day-summary">
                    {isFreeDay
                      ? <span style={{color:'var(--green)'}}>No sessions booked</span>
                      : <>
                          <span>{daySessions.length} session{daySessions.length!==1?'s':''}</span>
                          {hasGap && <span style={{color:'var(--green)'}}>{gapCount} opening{gapCount!==1?'s':''}</span>}
                        </>
                    }
                    <span style={{color:'var(--text3)'}}>{isOpen?'▴':'▾'}</span>
                  </div>
                </div>

                {isOpen && (
                  isFreeDay
                    ? <div className="roster-free-day">✦ Fully available — no sessions booked this day</div>
                    : (
                      <div className="roster-slots">
                        {slots.map((slot,i) => {
                          if (slot.type==='gap') {
                            return (
                              <div key={i} className="roster-slot gap">
                                <span className="slot-time">{fmtTime(slot.startTime)} – {fmtTime(slot.endTime)}</span>
                                <span className="slot-gap-label">✦ Available — {slot.durationMin} min opening</span>
                              </div>
                            );
                          }
                          const student = USERS.find(u=>u.id===slot.session.studentId);
                          return (
                            <div key={i} className={`roster-slot booked ${slot.status}`}>
                              <span className="slot-time">{fmtTime(slot.startTime)} – {fmtTime(slot.endTime)}</span>
                              <span className="slot-student">{student?.name}</span>
                              <span className="slot-instrument">{slot.session.instrument}</span>
                              <span className="slot-dur">{slot.durationMin}m</span>
                              <span className={statusClass(slot.status)}>{slot.status}</span>
                            </div>
                          );
                        })}
                      </div>
                    )
                )}
              </div>
            );
          })}

          {allDates.length===0 && (
            <div style={{padding:'2rem',textAlign:'center',color:'var(--text3)'}}>No working days in selected range.</div>
          )}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   ADMIN DAY VIEW (accordion by tutor)
══════════════════════════════════════════════════ */
function AdminDayView({ sessions, onSelectSession, onTogglePay }) {
  const [openTutors, setOpenTutors] = useState({});
  const tutors = USERS.filter(u=>u.role==='tutor');

  // group sessions by tutor → sorted by time
  const byTutor = {};
  tutors.forEach(t => { byTutor[t.id] = []; });
  sessions.forEach(s => {
    if (!byTutor[s.tutorId]) byTutor[s.tutorId] = [];
    byTutor[s.tutorId].push(s);
  });
  Object.keys(byTutor).forEach(tid => {
    byTutor[tid].sort((a,b) => a.startTime.localeCompare(b.startTime));
  });

  const toggle = (id) => setOpenTutors(p=>({...p,[id]:!p[id]}));

  // CSV export
  function exportXLSX() {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => {
      const XLSX = window.XLSX;

      // Build rows
      const rows = sessions.map(s => ({
        'Date':             s.date,
        'Day':              new Date(s.date+'T00:00:00').toLocaleDateString('en-AU',{weekday:'long'}),
        'Student':          userName(s.studentId),
        'Tutor':            userName(s.tutorId),
        'Start':            fmtTime(s.startTime),
        'End':              fmtTime(s.endTime),
        'Duration':         s.durationMin + ' min',
        'Instrument':       s.instrument,
        'Accompaniment':    s.accompaniment || '',
        'Status':           s.status,
        'Tutor Paid':       s.payrollTutorPaid ? 'Yes' : 'No',
        'Payment Received': s.paymentReceived  ? 'Yes' : 'No',
        'Invoiced':         s.invoiced         ? 'Yes' : 'No',
      }));

      const ws = XLSX.utils.json_to_sheet(rows);

      // Column widths
      ws['!cols'] = [
        {wch:12},{wch:10},{wch:20},{wch:16},{wch:10},{wch:10},
        {wch:10},{wch:12},{wch:18},{wch:12},{wch:11},{wch:18},{wch:10}
      ];

      // Bold header row
      const range = XLSX.utils.decode_range(ws['!ref']);
      for (let C = range.s.c; C <= range.e.c; C++) {
        const cell = ws[XLSX.utils.encode_cell({r:0, c:C})];
        if (cell) cell.s = { font:{ bold:true }, fill:{ fgColor:{ rgb:'1E2535' } } };
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Sessions');
      XLSX.writeFile(wb, 'manly-music-sessions.xlsx');
    };
    document.head.appendChild(script);
  }

  return (
    <div>
      <div className="export-bar">
        <button className="btn btn-sm" onClick={exportXLSX}>⬇ Export XLSX</button>
      </div>
      <div className="day-view-wrap">

          <h3>All Sessions — February 2026</h3>
          <span style={{fontSize:'.82rem',color:'var(--text3)'}}>{sessions.length} sessions total</span>
        </div>
        {tutors.map(tutor => {
          const tutSessions = byTutor[tutor.id] || [];
          if (!tutSessions.length) return null;
          const open = openTutors[tutor.id] !== false; // default open
          const tutAtt = tutSessions.filter(s=>s.status==='attended').length;

          return (
            <div key={tutor.id} className="tutor-accordion">
              <div className="tutor-acc-hdr" onClick={()=>toggle(tutor.id)}>
                <div className="tutor-acc-hdr-left">
                  <div className="dot dot-blue"/>
                  <span className="tutor-name">{tutor.name}</span>
                  <span className="tutor-session-count">{tutSessions.length} sessions · {tutAtt} attended</span>

                    return (
                      <div key={s.id} className="admin-session-row" onClick={()=>onSelectSession(s)}>
                        <span className="asr-date">{new Date(s.date+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',weekday:'short'})}</span>
                        <span className="asr-time">{fmtTime(s.startTime)} – {fmtTime(s.endTime)}</span>

                        <div className="asr-payroll" onClick={e=>e.stopPropagation()}>

function LoginScreen({ onLogin, userType, onBack, users }) {
  const [email, setEmail] = useState('');

  const [err, setErr] = useState('');

  function handleLogin(e) {
    e.preventDefault();
    const user = users.find(u=>u.email===email && u.password===pw);
    if (user) {
      if (userType==='tutor' && user.role==='tutor') { onLogin(user); return; }
      if (userType==='staff' && (user.role==='admin'||user.role==='tutor')) { 
        // Give Jake admin privileges even though he's marked as tutor in database
        // This allows him to show in tutor lists for scheduling while accessing admin features
        if (user.email === 'pyrocideest2012@gmail.com') {
          onLogin({...user, role: 'admin'});
        } else {
          onLogin(user);
        }
        return;
      }
      if (userType===user.role) { onLogin(user); return; }
      setErr('Invalid credentials for this portal type.');
    } else { setErr('Incorrect username or password.'); }

  return (
    <div className="landing">

      <div style={{maxWidth:360,margin:'4rem auto',padding:'0 2rem'}}>

  const missedSessions = sessions.filter(s => s.status === 'missed').sort((a,b) => b.date.localeCompare(a.date));

  function SessionRow({ session, showQuickActions }) {
    const student = USERS.find(u => u.id === session.studentId);

          padding: '1rem',
          borderBottom: '1px solid var(--border)',

  return (

          {upcomingSessions.map(s => (
            <SessionRow key={s.id} session={s} showQuickActions={true} />
          ))}
        </div>
      )}

      {/* Completed Sessions */}
      {completedSessions.length > 0 && (
        <div className="card">
          <div className="card-hdr">
            <div className="card-title">Completed Sessions ({completedSessions.length})</div>
          </div>
          {completedSessions.slice(0, 10).map(s => (
            <SessionRow key={s.id} session={s} showQuickActions={false} />
          ))}
          {completedSessions.length > 10 && (
            <div style={{padding: '.75rem', textAlign: 'center', fontSize: '.85rem', color: 'var(--text3)'}}>
              Showing 10 most recent • {completedSessions.length - 10} more
            </div>
          )}
        </div>
      )}

      {/* Cancelled Sessions */}
      {cancelledSessions.length > 0 && (
        <div className="card">
          <div className="card-hdr">
            <div className="card-title">Cancelled Sessions ({cancelledSessions.length})</div>
          </div>
          {cancelledSessions.slice(0, 5).map(s => (
            <SessionRow key={s.id} session={s} showQuickActions={false} />
          ))}
          {cancelledSessions.length > 5 && (
            <div style={{padding: '.75rem', textAlign: 'center', fontSize: '.85rem', color: 'var(--text3)'}}>
              Showing 5 most recent • {cancelledSessions.length - 5} more
            </div>
          )}
        </div>
      )}

      {/* Missed Sessions */}
      {missedSessions.length > 0 && (
        <div className="card">
          <div className="card-hdr">
            <div className="card-title">Missed Sessions ({missedSessions.length})</div>
          </div>
          {missedSessions.slice(0, 5).map(s => (
            <SessionRow key={s.id} session={s} showQuickActions={false} />
          ))}
        </div>
      )}

      {sessions.length === 0 && (
        <div className="card" style={{padding: '2rem', textAlign: 'center', color: 'var(--text3)'}}>
          No sessions found
        </div>
      )}
    </div>
  );
}

function AdminDashboard({ user, sessions, onLogout, onUpdateSession, onSaveRecording, onMarkStatus, onAddSession, onTogglePay, onSendBroadcast, onSendReminder }) {
  const [activeSession, setActiveSession] = useState(null);
  const [showSchedule,  setShowSchedule]  = useState(false);
  const [showBroadcast, setShowBroadcast] = useState(false);
  const [showBroadcastEmail, setShowBroadcastEmail] = useState(false);
  const [filterStudent, setFilterStudent] = useState('all');
  const [view, setView]                   = useState('calendar'); // 'calendar' | 'list'
  const [searchQuery, setSearchQuery]     = useState('');
  const [showStudentList, setShowStudentList] = useState(false);

  const students = USERS.filter(u=>u.role==='student').sort((a,b)=>a.name.split(' ').pop().localeCompare(b.name.split(' ').pop()));
  
  // Filter students by search query (wildcard search on first name or surname)
  const filteredStudents = students.filter(s => {
    if (!searchQuery.trim()) return true;
    const query = searchQuery.toLowerCase();
    const nameParts = s.name.toLowerCase().split(' ');
    const firstName = nameParts[0];
    const surname = nameParts[nameParts.length - 1];
    return firstName.includes(query) || surname.includes(query) || s.name.toLowerCase().includes(query);
  });
  
  const visibleSessions = sessions.filter(s => {
    if (filterStudent !== 'all' && s.studentId !== parseInt(filterStudent)) return false;
    if (searchQuery.trim()) {
      const student = USERS.find(u => u.id === s.studentId);
      if (!student) return false;
      const query = searchQuery.toLowerCase();
      const nameParts = student.name.toLowerCase().split(' ');
      const firstName = nameParts[0];
      const surname = nameParts[nameParts.length - 1];
      return firstName.includes(query) || surname.includes(query) || student.name.toLowerCase().includes(query);
    }
    return true;
  });

  const attended = sessions.filter(s=>s.status==='attended').length;
  const missed   = sessions.filter(s=>s.status==='missed').length;
  const revenue  = sessions.filter(s=>s.paymentReceived).length;
  const unpaid   = sessions.filter(s=>s.status==='attended'&&!s.payrollTutorPaid).length;
  
  // Calculate overdue assessments (attended sessions without assessments, >2 hours old)
  const now = new Date();
  const twoHoursAgo = new Date(now.getTime() - 2 * 60 * 60 * 1000);
  const overdueAssessments = sessions.filter(s => {
    if (s.status !== 'attended') return false;
    const hasAssessment = s.ratingTechnique || s.ratingRhythm || s.ratingTone || 
                          s.ratingSightReading || s.ratingExpression || s.ratingFocus;
    if (hasAssessment) return false;
    const sessionDateTime = new Date(`${s.date}T${s.endTime}`);
    return sessionDateTime <= twoHoursAgo;
  });

            <div key={l} className="stat-card">
              <div className="stat-val" style={c?{color:c}:{}}>{v}</div>
              <div className="stat-lbl">{l}</div>
            </div>
          ))}
        </div>

        {/* toolbar */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap',gap:'.75rem'}}>
          <div style={{display:'flex',gap:'.75rem',flexWrap:'wrap',alignItems:'center',flex:1}}>
            {/* Search Field */}
            <input 
              type="text" 
              placeholder="🔍 Search students (name or surname)..." 
              value={searchQuery}
              onChange={e => {
                setSearchQuery(e.target.value);
                setFilterStudent('all'); // Reset filter when searching
                if (e.target.value.trim()) {
                  setShowStudentList(true); // Show list when searching
                }
              }}
              style={{
                background:'var(--bg2)',
                border:'1px solid var(--border2)',
                borderRadius:'6px',
                color:'var(--text)',
                padding:'.6rem 1rem',
                fontSize:'.9rem',
                outline:'none',
                minWidth:'250px',
                flex:'0 1 auto'
              }}
              onFocus={e => e.target.style.borderColor = 'var(--accent)'}
              onBlur={e => e.target.style.borderColor = 'var(--border2)'}
            />
            
            {/* Student Filter Buttons */}
            <div className="cal-filter" style={{margin:0,flex:'1 1 auto'}}>
              <button

                onClick={()=>{
                  setFilterStudent('all');
                  setSearchQuery('');
                  setShowStudentList(!showStudentList);

                {'All Students'}
                {showStudentList && ` (${filteredStudents.length})`}

                <button key={s.id} className={`filter-btn${filterStudent===String(s.id)?' active':''}`} onClick={()=>{setFilterStudent(String(s.id));setSearchQuery('');setShowStudentList(false);}}>
                  {s.name}

              <button className={`btn btn-sm${view==='list'?' btn-primary':''}`} onClick={()=>setView('list')}>Day List</button>
              <button className={`btn btn-sm${view==='roster'?' btn-primary':''}`} onClick={()=>setView('roster')}>Tutor Roster</button>
              <button className="btn btn-sm" onClick={()=>setShowSchedule(true)}>+ Schedule</button>

              <button className="btn btn-amber btn-sm" onClick={()=>setShowBroadcast(true)}>📢 Broadcast SMS</button>
              <button className="btn btn-blue btn-sm" onClick={()=>setShowBroadcastEmail(true)}>📧 Broadcast Email</button>

          </div>

        <SessionPanel
          session={activeSession}
          userRole="admin"
          currentUserId={user.id}
          onClose={()=>setActiveSession(null)}
          onSaveRecording={onSaveRecording}

      {showSchedule && (
        <ScheduleModal
          onClose={()=>setShowSchedule(false)}

          sessions={sessions}

      {showBroadcast && (
        <BroadcastModal
          onClose={()=>setShowBroadcast(false)}

        />
      )}
      {showBroadcastEmail && (
        <BroadcastEmailModal
