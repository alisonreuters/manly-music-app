<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manly Music — Portal V4</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #080b10;
  --bg1:      #0d1117;
  --bg2:      #111620;
  --bg3:      #161c28;
  --border:   #1e2535;
  --border2:  #252d3e;
  --text:     #e2e8f0;
  --text2:    #94a3b8;
  --text3:    #4a5568;
  --green:    #22c55e;
  --red:      #ef4444;
  --blue:     #3b82f6;
  --amber:    #f59e0b;
  --slate:    #8895a7;
  --accent:   #6b8cff;
  --radius:   8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
input,textarea,select { font-family:'DM Sans',sans-serif; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg1); }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

/* ══════════════════════════════════
   MM LOGO
══════════════════════════════════ */
.logo-wrap { display:flex; align-items:center; gap:1rem; }
.logo-wordmark { font-size:0.7rem; letter-spacing:.22em; text-transform:uppercase; color:var(--slate); font-weight:500; }

/* ══════════════════════════════════
   LANDING
══════════════════════════════════ */
.landing {
  min-height:100vh;
  background: radial-gradient(ellipse 80% 50% at 50% -10%, #1a2340 0%, var(--bg) 70%);
}
.landing-header { padding:1.75rem 2.5rem; border-bottom:1px solid var(--border); }
.landing-hero { text-align:center; padding:5rem 2rem 3rem; max-width:820px; margin:0 auto; }
.landing-hero h1 { font-size:clamp(2rem,5vw,3.8rem); font-weight:300; line-height:1.15; letter-spacing:-.03em; margin-bottom:1.25rem; }
.landing-hero p { font-size:1.1rem; color:var(--text2); font-weight:300; }
.promo-box { background:var(--bg2); border:1px solid var(--border2); border-radius:10px; padding:1.75rem 2.25rem; margin:2.5rem auto; max-width:640px; }
.promo-box h2 { font-size:1.4rem; font-weight:400; margin-bottom:.6rem; }
.promo-box p { color:var(--text3); }
.login-section { max-width:380px; margin:2rem auto 4rem; padding:0 2rem; }
.login-section h3 { text-align:center; margin-bottom:1.5rem; font-weight:400; color:var(--text3); font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; }
.login-buttons { display:flex; flex-direction:column; gap:.8rem; }
.login-btn { background:transparent; border:1px solid var(--border2); color:var(--text2); padding:1rem; border-radius:var(--radius); font-size:.95rem; cursor:pointer; transition:all .2s; letter-spacing:.02em; }
.login-btn:hover { background:var(--bg3); border-color:var(--accent); color:var(--text); }

/* ══════════════════════════════════
   APP SHELL
══════════════════════════════════ */
.app-header { background:var(--bg1); border-bottom:1px solid var(--border); padding:1rem 2rem; position:sticky; top:0; z-index:100; }
.app-header-inner { max-width:1500px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
.app-header h2 { font-size:1.1rem; font-weight:500; }
.app-header p { font-size:.8rem; color:var(--text3); margin-top:.15rem; }
.dashboard { max-width:1500px; margin:0 auto; padding:1.75rem 2rem; }

/* ══════════════════════════════════
   BUTTONS & INPUTS
══════════════════════════════════ */
.btn { background:transparent; border:1px solid var(--border2); color:var(--text2); padding:.55rem 1.2rem; border-radius:6px; cursor:pointer; transition:all .2s; font-size:.875rem; font-family:'DM Sans',sans-serif; }
.btn:hover { background:var(--bg3); border-color:var(--accent); color:var(--text); }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover { background:#5577ee; border-color:#5577ee; color:#fff; }
.btn-sm { padding:.35rem .8rem; font-size:.8rem; }
.btn-green  { border-color:rgba(34,197,94,.4);  color:var(--green);  }
.btn-red    { border-color:rgba(239,68,68,.4);  color:var(--red);    }
.btn-blue   { border-color:rgba(59,130,246,.4); color:var(--blue);   }
.btn-amber  { border-color:rgba(245,158,11,.4); color:var(--amber);  }
.btn-green:hover  { background:rgba(34,197,94,.1);  }
.btn-red:hover    { background:rgba(239,68,68,.1);  }
.btn-blue:hover   { background:rgba(59,130,246,.1); }
.btn-amber:hover  { background:rgba(245,158,11,.1); }

.field { display:flex; flex-direction:column; gap:.4rem; margin-bottom:1rem; }
.field label { font-size:.78rem; color:var(--text2); letter-spacing:.04em; text-transform:uppercase; }
.field input,.field textarea,.field select {
  background:var(--bg2); border:1px solid var(--border2); border-radius:6px;
  color:var(--text); padding:.7rem 1rem; font-size:.9rem; outline:none; transition:border-color .2s;
  width:100%;
}
.field input:focus,.field textarea:focus,.field select:focus { border-color:var(--accent); }
.field textarea { min-height:80px; resize:vertical; }
.field select option { background:var(--bg2); }

/* ══════════════════════════════════
   STATS GRID
══════════════════════════════════ */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1rem; margin-bottom:1.75rem; }
.stat-card { background:var(--bg2); border:1px solid var(--border); padding:1.25rem 1.5rem; border-radius:var(--radius); }
.stat-val { font-size:2rem; font-weight:300; letter-spacing:-.03em; margin-bottom:.3rem; }
.stat-lbl { font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; }

/* ══════════════════════════════════
   CARD
══════════════════════════════════ */
.card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; margin-bottom:1.25rem; }
.card-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; }
.card-title { font-size:1rem; font-weight:500; }

/* ══════════════════════════════════
   BADGES
══════════════════════════════════ */
.badge { display:inline-flex; align-items:center; padding:.2rem .65rem; border-radius:20px; font-size:.72rem; font-weight:500; border:1px solid; }
.badge-attended  { background:rgba(34,197,94,.1);  border-color:rgba(34,197,94,.4);  color:var(--green); }
.badge-missed    { background:rgba(239,68,68,.1);  border-color:rgba(239,68,68,.4);  color:var(--red);   }
.badge-scheduled { background:rgba(59,130,246,.1); border-color:rgba(59,130,246,.4); color:var(--blue);  }
.badge-cancelled { background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.4); color:var(--amber); }
.badge-pending   { background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.4); color:var(--amber); }
.badge-complete  { background:rgba(34,197,94,.1);  border-color:rgba(34,197,94,.4);  color:var(--green); }
.badge-progress  { background:rgba(59,130,246,.1); border-color:rgba(59,130,246,.4); color:var(--blue);  }

/* ══════════════════════════════════
   MODAL
══════════════════════════════════ */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; z-index:500; padding:1rem; }
.modal-box { background:var(--bg2); border:1px solid var(--border2); border-radius:12px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; }
.modal-hdr { padding:1.5rem 1.75rem 1rem; display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--border); }
.modal-hdr h3 { font-size:1.15rem; font-weight:500; }
.modal-body { padding:1.5rem 1.75rem; }
.modal-footer { padding:1rem 1.75rem 1.5rem; display:flex; gap:.75rem; justify-content:flex-end; border-top:1px solid var(--border); }

/* ══════════════════════════════════
   CALENDAR SHELL
══════════════════════════════════ */
.cal-wrap { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; margin-bottom:1.5rem; }
.cal-toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:1.25rem; }
.cal-nav { display:flex; align-items:center; gap:.6rem; }
.cal-nav-btn { background:transparent; border:1px solid var(--border2); color:var(--text2); width:30px; height:30px; border-radius:5px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; }
.cal-nav-btn:hover { background:var(--bg3); border-color:var(--accent); color:var(--text); }
.cal-month { font-size:1.15rem; font-weight:400; min-width:170px; text-align:center; }
.cal-stats { display:flex; gap:1.25rem; flex-wrap:wrap; align-items:center; }
.cal-stat { display:flex; align-items:center; gap:.4rem; font-size:.8rem; color:var(--text2); }
.dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot-green  { background:var(--green); }
.dot-red    { background:var(--red);   }
.dot-blue   { background:var(--blue);  }
.dot-amber  { background:var(--amber); }
.rate-pill { background:var(--bg3); border:1px solid var(--border2); border-radius:20px; padding:.2rem .8rem; font-size:.8rem; color:var(--text2); }
.rate-pill b { color:var(--green); }
.rate-ok b { color:var(--amber); }
.rate-poor b { color:var(--red); }

/* student filter */
.cal-filter { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1rem; }
.filter-btn { background:transparent; border:1px solid var(--border); color:var(--text3); padding:.3rem .8rem; border-radius:20px; font-size:.78rem; cursor:pointer; transition:all .2s; }
.filter-btn.active, .filter-btn:hover { background:rgba(107,140,255,.12); border-color:var(--accent); color:var(--accent); }

/* grid */
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-day-hdr { text-align:center; padding:.5rem 0; color:var(--text3); font-size:.72rem; font-weight:500; letter-spacing:.06em; text-transform:uppercase; }
.cal-cell { min-height:56px; border:1px solid var(--border); border-radius:5px; padding:.4rem .5rem; cursor:pointer; transition:all .18s; position:relative; display:flex; flex-direction:column; }
.cal-cell:hover { border-color:var(--border2); background:var(--bg3); }
.cal-cell.other-month { opacity:.2; pointer-events:none; }
.cal-cell.today { border-color:var(--accent); }
.cal-cell.has-attended  { border-color:rgba(34,197,94,.4);  background:rgba(34,197,94,.04);  }
.cal-cell.has-missed    { border-color:rgba(239,68,68,.4);  background:rgba(239,68,68,.04);  }
.cal-cell.has-scheduled { border-color:rgba(59,130,246,.3); background:rgba(59,130,246,.04); }
.cal-cell.has-cancelled { border-color:rgba(245,158,11,.3); background:rgba(245,158,11,.04); }
.cal-day-num { font-size:.78rem; color:var(--text2); line-height:1; margin-bottom:.3rem; font-family:'DM Mono',monospace; }
.cal-cell.today .cal-day-num { color:var(--accent); font-weight:600; }
.cal-pips { display:flex; gap:2px; flex-wrap:wrap; }
.cal-pip { width:6px; height:6px; border-radius:50%; }

/* ══════════════════════════════════
   SESSION DETAIL PANEL (slide-in)
══════════════════════════════════ */
.session-panel-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; }
.session-panel {
  position:fixed; top:0; right:0; bottom:0; width:min(480px,100vw);
  background:var(--bg1); border-left:1px solid var(--border2);
  z-index:301; overflow-y:auto;
  animation: slideIn .22s ease;
}
@keyframes slideIn { from { transform:translateX(100%); } to { transform:translateX(0); } }
.sp-hdr { padding:1.5rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; position:sticky; top:0; background:var(--bg1); z-index:1; }
.sp-hdr h3 { font-size:1.05rem; font-weight:500; }
.sp-body { padding:1.5rem; display:flex; flex-direction:column; gap:1.25rem; }
.sp-section { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:1.1rem 1.25rem; }
.sp-section-title { font-size:.72rem; color:var(--text3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:.75rem; }
.sp-row { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:.5rem; font-size:.88rem; }
.sp-row:last-child { margin-bottom:0; }
.sp-lbl { color:var(--text3); flex-shrink:0; }
.sp-val { color:var(--text); text-align:right; }
.sp-comment { font-size:.88rem; color:var(--text2); line-height:1.55; }
.sp-empty { font-size:.85rem; color:var(--text3); font-style:italic; }

/* recording UI */
.rec-area { display:flex; flex-direction:column; gap:.75rem; }
.rec-btn-row { display:flex; gap:.6rem; }
.rec-item { background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:.75rem 1rem; display:flex; justify-content:space-between; align-items:center; font-size:.85rem; }
.rec-item-name { color:var(--text2); }
.rec-pulse { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--red); animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
.rec-timer { font-family:'DM Mono',monospace; font-size:1.1rem; color:var(--red); }

/* ══════════════════════════════════
   TUTOR ROSTER
══════════════════════════════════ */
.roster-wrap { margin-bottom:1.5rem; }
.roster-tutor-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:.75rem; margin-bottom:1.5rem; }
.roster-tutor-card {
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  padding:1.1rem 1.25rem; cursor:pointer; transition:all .2s;
}
.roster-tutor-card:hover { border-color:var(--accent); background:var(--bg3); }
.roster-tutor-card.active { border-color:var(--accent); background:rgba(107,140,255,.07); }
.rtc-name { font-size:.95rem; font-weight:500; margin-bottom:.4rem; }
.rtc-meta { font-size:.78rem; color:var(--text3); display:flex; gap:.75rem; flex-wrap:wrap; }
.rtc-dot { width:8px; height:8px; border-radius:50%; background:var(--blue); display:inline-block; margin-right:.35rem; }

/* Expanded roster detail */
.roster-detail { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.roster-detail-hdr {
  padding:1rem 1.5rem; border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.75rem;
}
.roster-detail-hdr h3 { font-size:1rem; font-weight:500; }

/* Date range filter */
.roster-range { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
.roster-range label { font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.04em; }
.roster-range input {
  background:var(--bg3); border:1px solid var(--border2); border-radius:5px;
  color:var(--text); padding:.35rem .7rem; font-size:.82rem; outline:none;
  font-family:'DM Sans',sans-serif;
}
.roster-range input:focus { border-color:var(--accent); }

/* Day rows */
.roster-day-row { border-bottom:1px solid var(--border); }
.roster-day-row:last-child { border-bottom:none; }
.roster-day-hdr {
  padding:.7rem 1.5rem; display:flex; justify-content:space-between; align-items:center;
  cursor:pointer; transition:background .15s;
}
.roster-day-hdr:hover { background:var(--bg3); }
.roster-day-date { font-size:.85rem; font-weight:500; }
.roster-day-date.has-gap { color:var(--green); }
.roster-day-summary { font-size:.78rem; color:var(--text3); display:flex; gap:.75rem; }

/* Slot timeline */
.roster-slots { padding:.5rem 1.5rem 1rem; display:flex; flex-direction:column; gap:.35rem; }
.roster-slot {
  display:flex; align-items:center; gap:.75rem; padding:.5rem .85rem;
  border-radius:5px; border:1px solid; font-size:.82rem;
}
.roster-slot.booked {
  background:rgba(59,130,246,.06); border-color:rgba(59,130,246,.25);
}
.roster-slot.booked.attended  { background:rgba(34,197,94,.06);  border-color:rgba(34,197,94,.25);  }
.roster-slot.booked.missed    { background:rgba(239,68,68,.06);  border-color:rgba(239,68,68,.25);  }
.roster-slot.booked.cancelled { background:rgba(245,158,11,.06); border-color:rgba(245,158,11,.25); }
.roster-slot.gap {
  background:rgba(34,197,94,.04); border-color:rgba(34,197,94,.2);
  border-style:dashed;
}
.slot-time { font-family:'DM Mono',monospace; font-size:.8rem; color:var(--text2); width:120px; flex-shrink:0; }
.slot-student { flex:1; color:var(--text); }
.slot-gap-label { flex:1; color:var(--green); font-style:italic; }
.slot-dur { font-size:.75rem; color:var(--text3); }
.slot-instrument { font-size:.75rem; color:var(--text3); }

/* No-session day */
.roster-free-day {
  margin:.5rem 1.5rem 1rem; padding:.6rem 1rem;
  background:rgba(34,197,94,.05); border:1px dashed rgba(34,197,94,.3);
  border-radius:5px; font-size:.82rem; color:var(--green);
}

/* ══════════════════════════════════
   ADMIN DAY VIEW (accordion)
══════════════════════════════════ */
.day-view-wrap { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:1.5rem; overflow:hidden; }
.day-view-hdr { padding:1rem 1.5rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
.day-view-hdr h3 { font-size:.95rem; font-weight:500; }
.tutor-accordion { border-bottom:1px solid var(--border); }
.tutor-accordion:last-child { border-bottom:none; }
.tutor-acc-hdr { padding:.85rem 1.5rem; display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:background .2s; }
.tutor-acc-hdr:hover { background:var(--bg3); }
.tutor-acc-hdr-left { display:flex; align-items:center; gap:.75rem; }
.tutor-name { font-size:.9rem; font-weight:500; }
.tutor-session-count { font-size:.75rem; color:var(--text3); }
.tutor-acc-body { padding:0 1.5rem 1rem; display:flex; flex-direction:column; gap:.5rem; }
.admin-session-row {
  background:var(--bg3); border:1px solid var(--border); border-radius:6px;
  padding:.75rem 1rem; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; cursor:pointer; transition:border-color .2s;
}
.admin-session-row:hover { border-color:var(--border2); }
.asr-date { font-family:'DM Mono',monospace; font-size:.82rem; color:var(--text2); width:90px; flex-shrink:0; }
.asr-time { font-family:'DM Mono',monospace; font-size:.82rem; color:var(--text2); width:120px; flex-shrink:0; }
.asr-student { font-size:.88rem; font-weight:500; flex:1; }
.asr-instrument { font-size:.8rem; color:var(--text3); }
.asr-payroll { display:flex; gap:.4rem; align-items:center; margin-left:auto; }
.pay-check { width:14px; height:14px; border-radius:3px; border:1px solid var(--border2); background:transparent; cursor:pointer; appearance:none; flex-shrink:0; }
.pay-check:checked { background:var(--green); border-color:var(--green); }
.pay-label { font-size:.75rem; color:var(--text3); }

/* ══════════════════════════════════
   CSV EXPORT
══════════════════════════════════ */
.export-bar { display:flex; justify-content:flex-end; margin-bottom:1.25rem; }

/* ══════════════════════════════════
   TASK ITEMS
══════════════════════════════════ */
.task-item { border:1px solid var(--border); border-radius:6px; padding:1.25rem; margin-bottom:.75rem; transition:border-color .2s; }
.task-item:hover { border-color:var(--border2); }
.task-title { font-weight:500; margin-bottom:.35rem; }
.task-desc { color:var(--text3); font-size:.875rem; margin-bottom:.6rem; }

/* ══════════════════════════════════
   RESPONSIVE
══════════════════════════════════ */
@media(max-width:768px){
  .landing-hero h1 { font-size:2rem; }
  .dashboard { padding:1rem; }
  .stats-grid { grid-template-columns:1fr 1fr; }
  .cal-cell { min-height:42px; }
  .session-panel { width:100vw; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ══════════════════════════════════════════════════
   MM LOGO SVG
══════════════════════════════════════════════════ */
function MMLogo({ height=46, small=false, wordmark=true }) {
  const h = small ? 32 : height;
  return (
    <div className="logo-wrap">
      <svg viewBox="0 0 120 80" style={{height:h,width:'auto'}} xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stopColor="#9aaaba"/>
            <stop offset="100%" stopColor="#6b7a8d"/>
          </linearGradient>
          <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">

/* ══════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════ */
function fmtDuration(s) { const m=Math.floor(s/60), sec=s%60; return `${m}:${String(sec).padStart(2,'0')}`; }
function fmtDate(d) { const [y,mo,day]=d.split('-'); return `${day} ${MONTHS[parseInt(mo)-1]} ${y}`; }
function fmtTime(t) { if(!t) return '—'; const [h,m]=t.split(':').map(Number); const ap=h>=12?'pm':'am'; return `${h===0?12:h>12?h-12:h}:${String(m).padStart(2,'0')}${ap}`; }
function statusColor(s) { return s==='attended'?'#22c55e':s==='missed'?'#ef4444':s==='scheduled'?'#3b82f6':s==='cancelled'?'#f59e0b':'#4a5568'; }
function statusClass(s) { return `badge badge-${s||'pending'}`; }

function userName(id) { return USERS.find(u=>u.id===id)?.name || '—'; }

/* ══════════════════════════════════════════════════
   RECORDING COMPONENT
══════════════════════════════════════════════════ */
const MAX_REC_SECONDS = 120; // 2 min

function RecordingSection({ session, canRecord, userRole, onSaveRecording }) {
  const [isRecording, setIsRecording] = useState(false);
  const [elapsed,     setElapsed]     = useState(0);
  const timerRef = useRef(null);

  useEffect(() => {
    if (isRecording) {
      timerRef.current = setInterval(() => {
        setElapsed(p => {
          if (p + 1 >= MAX_REC_SECONDS) { stopRecording(p+1); return p+1; }
          return p + 1;
        });
      }, 1000);
    }
    return () => clearInterval(timerRef.current);
  }, [isRecording]);

  function startRecording() { setIsRecording(true); setElapsed(0); }
  function stopRecording(dur) {
    clearInterval(timerRef.current);
    setIsRecording(false);
    const actualDur = dur !== undefined ? dur : elapsed;
    const label = userRole === 'student'
      ? `Practice – ${session.instrument} ${new Date().toLocaleDateString('en-AU')}`
      : `Session Note – ${fmtDate(session.date)}`;
    onSaveRecording(session.id, { id:'r'+Date.now(), label, duration:actualDur, date:TODAY, role:userRole });
    setElapsed(0);
  }

  const myRecs   = session.recordings.filter(r => r.role === userRole);
  const theirRecs= session.recordings.filter(r => r.role !== userRole);

  return (
    <div className="rec-area">
      {/* My recordings */}
      {myRecs.map(r => (
        <div key={r.id} className="rec-item">
          <span className="rec-item-name">🎵 {r.label}</span>
          <span style={{fontFamily:'DM Mono,monospace',fontSize:'.8rem',color:'var(--text3)'}}>{fmtDuration(r.duration)}</span>
        </div>
      ))}

      {/* Other role recordings (read-only labels) */}
      {theirRecs.length > 0 && (
        <div style={{marginTop:'.25rem'}}>
          <div style={{fontSize:'.72rem',color:'var(--text3)',marginBottom:'.4rem',textTransform:'uppercase',letterSpacing:'.06em'}}>
            {userRole === 'student' ? 'Tutor recordings' : 'Student recordings'}
          </div>
          {theirRecs.map(r => (
            <div key={r.id} className="rec-item" style={{opacity:.7}}>
              <span className="rec-item-name">🎵 {r.label}</span>
              <span style={{fontFamily:'DM Mono,monospace',fontSize:'.8rem',color:'var(--text3)'}}>{fmtDuration(r.duration)}</span>
            </div>
          ))}
        </div>
      )}

      {/* Record controls */}
      {canRecord && !isRecording && (
        <button className="btn btn-sm" style={{alignSelf:'flex-start'}} onClick={startRecording}>
          ● Record {userRole==='student'?'Practice':'Session Note'} (max 2 min)
        </button>
      )}
      {canRecord && isRecording && (
        <div style={{display:'flex',alignItems:'center',gap:'1rem',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,padding:'.75rem 1rem'}}>
          <span className="rec-pulse"></span>
          <span className="rec-timer">{fmtDuration(elapsed)}</span>
          <span style={{fontSize:'.8rem',color:'var(--text3)'}}>/ 2:00 max</span>
          <button className="btn btn-sm btn-red" style={{marginLeft:'auto'}} onClick={() => stopRecording()}>⏹ Stop & Save</button>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════

function AttendanceCalendar({ sessions, userRole, currentUserId, filterStudentIds, onSelectSession }) {
  const todayDate = new Date(2026, 1, 17);
  const [date, setDate] = useState(new Date(2026, 1, 1));

  const year = date.getFullYear(), month = date.getMonth();

  // build day → sessions map
  const dayMap = {};
  sessions.forEach(s => {
    if (!dayMap[s.date]) dayMap[s.date] = [];
    dayMap[s.date].push(s);
  });

  // dominant status for cell
  function dominant(recs) {
    if (recs.some(r=>r.status==='attended'))  return 'attended';
    if (recs.some(r=>r.status==='missed'))    return 'missed';
    if (recs.some(r=>r.status==='cancelled')) return 'cancelled';
    if (recs.some(r=>r.status==='scheduled')) return 'scheduled';
    return null;
  }

  const firstDay    = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // stats
  const monthSessions = sessions.filter(s => {
    const [y,m] = s.date.split('-').map(Number);
    return y===year && m-1===month;
  });
  const att  = monthSessions.filter(s=>s.status==='attended').length;
  const miss = monthSessions.filter(s=>s.status==='missed').length;
  const sch  = monthSessions.filter(s=>s.status==='scheduled').length;
  const can  = monthSessions.filter(s=>s.status==='cancelled').length;
  const total = att + miss;
  const rate  = total > 0 ? Math.round(att/total*100) : null;

  const cells = [];
  for (let i=0; i<firstDay; i++) cells.push({type:'blank',key:'b'+i});
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const recs    = dayMap[dateStr] || [];
    const dom     = dominant(recs);
    const isToday = dateStr === TODAY;
    cells.push({ type:'day', key:dateStr, day:d, dateStr, recs, dom, isToday });
  }

  return (
    <div className="cal-wrap">
      <div className="cal-toolbar">
        <div className="cal-nav">
          <button className="cal-nav-btn" onClick={()=>setDate(new Date(year,month-1,1))}>‹</button>
          <div className="cal-month">{MONTHS[month]} {year}</div>
          <button className="cal-nav-btn" onClick={()=>setDate(new Date(year,month+1,1))}>›</button>
        </div>
        <div className="cal-stats">
          {att  > 0 && <div className="cal-stat"><div className="dot dot-green"/><b>{att}</b> attended</div>}
          {miss > 0 && <div className="cal-stat"><div className="dot dot-red"/><b>{miss}</b> missed</div>}
          {sch  > 0 && <div className="cal-stat"><div className="dot dot-blue"/><b>{sch}</b> upcoming</div>}
          {can  > 0 && <div className="cal-stat"><div className="dot dot-amber"/><b>{can}</b> cancelled</div>}
          {rate !== null && (
            <div className={`rate-pill${rate>=80?'':rate>=60?' rate-ok':' rate-poor'}`}>
              Attendance <b>{rate}%</b>
            </div>
          )}
        </div>
      </div>

      <div className="cal-grid">
        {WDAYS.map(d=><div key={d} className="cal-day-hdr">{d}</div>)}
        {cells.map(cell => {
          if (cell.type==='blank') return <div key={cell.key} className="cal-cell other-month"/>;
          const { key, day, recs, dom, isToday, dateStr } = cell;
          let cls = 'cal-cell';
          if (dom) cls += ` has-${dom}`;
          if (isToday) cls += ' today';

          return (
            <div key={key} className={cls} onClick={() => recs.length > 0 && onSelectSession(recs[0])}>
              <div className="cal-day-num">{day}</div>
              {recs.length > 0 && (
                <div className="cal-pips">
                  {recs.slice(0,6).map((r,i) => (
                    <div key={i} className="cal-pip" style={{background:statusColor(r.status)}}/>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   SCHEDULE SESSION MODAL (tutor / admin)
══════════════════════════════════════════════════ */
function ScheduleModal({ onClose, onSave, currentUserId, userRole }) {
  const students = USERS.filter(u=>u.role==='student');
  const tutors   = USERS.filter(u=>u.role==='tutor');
  const [form, setForm] = useState({
    studentId: students[0]?.id || '',
    tutorId:   userRole==='tutor' ? currentUserId : (tutors[0]?.id || ''),
    date:      TODAY,
    startTime: '09:00',
    durationMin: 30,
    instrument: 'Piano',
    accompaniment: '',
    plannedSummary: ''
  });

  function calcEnd(start, mins) {
    if (!start) return '';
    const [h,m] = start.split(':').map(Number);
    const total = h*60+m+parseInt(mins);
    return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
  }

  function handleSave() {
    const endTime = calcEnd(form.startTime, form.durationMin);
    onSave({
      id: 's'+Date.now(),
      studentId: parseInt(form.studentId),
      tutorId:   parseInt(form.tutorId),
      date:      form.date,
      startTime: form.startTime,
      endTime,
      durationMin: parseInt(form.durationMin),
      instrument:    form.instrument,
      accompaniment: form.accompaniment,
      status: 'scheduled',
      plannedSummary: form.plannedSummary,
      tutorComments: '', studentComments: '',
      recordings: [],
      payrollTutorPaid:false, paymentReceived:false, invoiced:false
    });
    onClose();
  }

  const f = (field, val) => setForm(p=>({...p,[field]:val}));

  return (
    <div className="modal-overlay">
      <div className="modal-box">
        <div className="modal-hdr">
          <h3>Schedule New Session</h3>
          <button className="btn btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="field">
            <label>Student</label>
            <select value={form.studentId} onChange={e=>f('studentId',e.target.value)}>
              {students.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Tutor</label>
            <select value={form.tutorId} onChange={e=>f('tutorId',e.target.value)} disabled={userRole==='tutor'}>
              {tutors.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}>
            <div className="field">
              <label>Date</label>
              <input type="date" value={form.date} onChange={e=>f('date',e.target.value)}/>
            </div>
            <div className="field">
              <label>Start Time</label>
              <input type="time" value={form.startTime} onChange={e=>f('startTime',e.target.value)}/>
            </div>
          </div>
          <div className="field">
            <label>Duration</label>
            <select value={form.durationMin} onChange={e=>f('durationMin',e.target.value)}>
              <option value={30}>30 minutes</option>
              <option value={45}>45 minutes</option>
              <option value={60}>60 minutes</option>
            </select>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}>
            <div className="field">
              <label>Instrument</label>
              <input value={form.instrument} onChange={e=>f('instrument',e.target.value)} placeholder="Piano, Guitar…"/>
            </div>
            <div className="field">
              <label>Accompaniment</label>
              <input value={form.accompaniment} onChange={e=>f('accompaniment',e.target.value)} placeholder="Bio backing, none…"/>
            </div>
          </div>
          <div className="field">
            <label>Planned Session Summary</label>
            <textarea value={form.plannedSummary} onChange={e=>f('plannedSummary',e.target.value)} placeholder="What to expect, focus areas, materials to bring…"/>
          </div>
          <div style={{fontSize:'.8rem',color:'var(--text3)',marginTop:'-.5rem'}}>
            End time: <strong style={{color:'var(--text2)'}}>{fmtTime(calcEnd(form.startTime,form.durationMin))}</strong>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave}>Schedule Session</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   ADMIN DAY VIEW (accordion by tutor)
══════════════════════════════════════════════════ */
function TutorRoster({ sessions, currentUserId, userRole }) {
  const tutors = USERS.filter(u => u.role === 'tutor');
  const visibleTutors = userRole === 'tutor'
    ? tutors.filter(t => t.id === currentUserId)
    : tutors;

  const [selectedTutor, setSelectedTutor] = useState(
    userRole === 'tutor' ? currentUserId : null
  );
  const [fromDate, setFromDate] = useState('2026-02-01');
  const [toDate,   setToDate]   = useState('2026-02-28');
  const [openDays, setOpenDays] = useState({});

  function toggleDay(d) { setOpenDays(p => ({...p, [d]: p[d]===false ? true : false})); }

  const tutorSessions = selectedTutor
    ? sessions.filter(s =>
        s.tutorId === selectedTutor &&
        s.date >= fromDate &&
        s.date <= toDate
      ).sort((a,b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime))
    : [];

  const WORK_START = '08:30';
  const WORK_END   = '17:00';

  function timeToMins(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }
  function minsToTime(m) { return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }

  function getDatesInRange(from, to) {
    const dates = [];
    let cur = new Date(from + 'T00:00:00');
    const end = new Date(to + 'T00:00:00');
    while (cur <= end) {
      const wd = cur.getDay();
      if (wd !== 0 && wd !== 6) dates.push(cur.toISOString().slice(0,10));
      cur.setDate(cur.getDate() + 1);
    }
    return dates;
  }

  const allDates = getDatesInRange(fromDate, toDate);

  function buildDaySlots(date) {
    const daySessions = tutorSessions.filter(s => s.date === date)
      .sort((a,b) => a.startTime.localeCompare(b.startTime));
    const slots = [];
    let cursor = timeToMins(WORK_START);
    daySessions.forEach(s => {
      const sStart = timeToMins(s.startTime);
      const sEnd   = timeToMins(s.endTime);
      if (sStart > cursor + 14) {
        slots.push({ type:'gap', startTime:minsToTime(cursor), endTime:s.startTime, durationMin:sStart-cursor });
      }
      slots.push({ type:'booked', session:s, startTime:s.startTime, endTime:s.endTime, durationMin:s.durationMin, status:s.status });
      cursor = sEnd;
    });
    const workEnd = timeToMins(WORK_END);
    if (workEnd > cursor + 14) {
      slots.push({ type:'gap', startTime:minsToTime(cursor), endTime:WORK_END, durationMin:workEnd-cursor });
    }
    return { daySessions, slots };
  }

  function tutorStats(tid) {
    const ts = sessions.filter(s => s.tutorId === tid);
    return {
      upcoming: ts.filter(s=>s.status==='scheduled').length,
      attended: ts.filter(s=>s.status==='attended').length,
      students: new Set(ts.map(s=>s.studentId)).size
    };
  }

  const selectedTutorObj = tutors.find(t => t.id === selectedTutor);

  return (
    <div className="roster-wrap">
      {userRole !== 'tutor' && (
        <div className="roster-tutor-list">
          {visibleTutors.map(t => {
            const st = tutorStats(t.id);
            return (
              <div key={t.id}
                className={`roster-tutor-card${selectedTutor===t.id?' active':''}`}
                onClick={() => setSelectedTutor(selectedTutor===t.id ? null : t.id)}>
                <div className="rtc-name"><span className="rtc-dot"/>{t.name}</div>
                <div className="rtc-meta">
                  <span>{st.students} students</span>
                  <span>{st.upcoming} upcoming</span>
                  <span>{st.attended} taught</span>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {selectedTutor && (
        <div className="roster-detail">
          <div className="roster-detail-hdr">
            <h3>{selectedTutorObj?.name} — Schedule</h3>
            <div className="roster-range">
              <label>From</label>
              <input type="date" value={fromDate} onChange={e=>setFromDate(e.target.value)}/>
              <label>To</label>
              <input type="date" value={toDate} onChange={e=>setToDate(e.target.value)}/>
            </div>
          </div>

          {allDates.map(date => {
            const { daySessions, slots } = buildDaySlots(date);
            const hasGap   = slots.some(s=>s.type==='gap');
            const isFreeDay= daySessions.length === 0;
            const isOpen   = openDays[date] !== false;
            const dateObj  = new Date(date+'T00:00:00');
            const dayLabel = dateObj.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
            const gapCount = slots.filter(s=>s.type==='gap').length;

            return (
              <div key={date} className="roster-day-row">
                <div className="roster-day-hdr" onClick={()=>toggleDay(date)}>
                  <span className={`roster-day-date${(hasGap||isFreeDay)?' has-gap':''}`}>
                    {dayLabel}
                    {isFreeDay && ' ✦ Free Day'}
                    {!isFreeDay && hasGap && ' ✦ Has Openings'}
                  </span>
                  <div className="roster-day-summary">
                    {isFreeDay
                      ? <span style={{color:'var(--green)'}}>No sessions booked</span>
                      : <>
                          <span>{daySessions.length} session{daySessions.length!==1?'s':''}</span>
                          {hasGap && <span style={{color:'var(--green)'}}>{gapCount} opening{gapCount!==1?'s':''}</span>}
                        </>
                    }
                    <span style={{color:'var(--text3)'}}>{isOpen?'▴':'▾'}</span>
                  </div>
                </div>

                {isOpen && (
                  isFreeDay
                    ? <div className="roster-free-day">✦ Fully available — no sessions booked this day</div>
                    : (
                      <div className="roster-slots">
                        {slots.map((slot,i) => {
                          if (slot.type==='gap') {
                            return (
                              <div key={i} className="roster-slot gap">
                                <span className="slot-time">{fmtTime(slot.startTime)} – {fmtTime(slot.endTime)}</span>
                                <span className="slot-gap-label">✦ Available — {slot.durationMin} min opening</span>
                              </div>
                            );
                          }
                          const student = USERS.find(u=>u.id===slot.session.studentId);
                          return (
                            <div key={i} className={`roster-slot booked ${slot.status}`}>
                              <span className="slot-time">{fmtTime(slot.startTime)} – {fmtTime(slot.endTime)}</span>
                              <span className="slot-student">{student?.name}</span>
                              <span className="slot-instrument">{slot.session.instrument}</span>
                              <span className="slot-dur">{slot.durationMin}m</span>
                              <span className={statusClass(slot.status)}>{slot.status}</span>
                            </div>
                          );
                        })}
                      </div>
                    )
                )}
              </div>
            );
          })}

          {allDates.length===0 && (
            <div style={{padding:'2rem',textAlign:'center',color:'var(--text3)'}}>No working days in selected range.</div>
          )}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   ADMIN DAY VIEW (accordion by tutor)
══════════════════════════════════════════════════ */
function AdminDayView({ sessions, onSelectSession, onTogglePay }) {
  const [openTutors, setOpenTutors] = useState({});
  const tutors = USERS.filter(u=>u.role==='tutor');

  // group sessions by tutor → sorted by time
  const byTutor = {};
  tutors.forEach(t => { byTutor[t.id] = []; });
  sessions.forEach(s => {
    if (!byTutor[s.tutorId]) byTutor[s.tutorId] = [];
    byTutor[s.tutorId].push(s);
  });
  Object.keys(byTutor).forEach(tid => {
    byTutor[tid].sort((a,b) => a.startTime.localeCompare(b.startTime));
  });

  const toggle = (id) => setOpenTutors(p=>({...p,[id]:!p[id]}));

  // CSV export
  function exportXLSX() {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => {
      const XLSX = window.XLSX;

      // Build rows
      const rows = sessions.map(s => ({
        'Date':             s.date,
        'Day':              new Date(s.date+'T00:00:00').toLocaleDateString('en-AU',{weekday:'long'}),
        'Student':          userName(s.studentId),
        'Tutor':            userName(s.tutorId),
        'Start':            fmtTime(s.startTime),
        'End':              fmtTime(s.endTime),
        'Duration':         s.durationMin + ' min',
        'Instrument':       s.instrument,
        'Accompaniment':    s.accompaniment || '',
        'Status':           s.status,
        'Tutor Paid':       s.payrollTutorPaid ? 'Yes' : 'No',
        'Payment Received': s.paymentReceived  ? 'Yes' : 'No',
        'Invoiced':         s.invoiced         ? 'Yes' : 'No',
      }));

      const ws = XLSX.utils.json_to_sheet(rows);

      // Column widths
      ws['!cols'] = [
        {wch:12},{wch:10},{wch:20},{wch:16},{wch:10},{wch:10},
        {wch:10},{wch:12},{wch:18},{wch:12},{wch:11},{wch:18},{wch:10}
      ];

      // Bold header row
      const range = XLSX.utils.decode_range(ws['!ref']);
      for (let C = range.s.c; C <= range.e.c; C++) {
        const cell = ws[XLSX.utils.encode_cell({r:0, c:C})];
        if (cell) cell.s = { font:{ bold:true }, fill:{ fgColor:{ rgb:'1E2535' } } };
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Sessions');
      XLSX.writeFile(wb, 'manly-music-sessions.xlsx');
    };
    document.head.appendChild(script);
  }

  return (
    <div>
      <div className="export-bar">
        <button className="btn btn-sm" onClick={exportXLSX}>⬇ Export XLSX</button>
      </div>
      <div className="day-view-wrap">
        <div className="day-view-hdr">
          <h3>All Sessions — February 2026</h3>
          <span style={{fontSize:'.82rem',color:'var(--text3)'}}>{sessions.length} sessions total</span>
        </div>
        {tutors.map(tutor => {
          const tutSessions = byTutor[tutor.id] || [];
          if (!tutSessions.length) return null;
          const open = openTutors[tutor.id] !== false; // default open
          const tutAtt = tutSessions.filter(s=>s.status==='attended').length;

          return (
            <div key={tutor.id} className="tutor-accordion">
              <div className="tutor-acc-hdr" onClick={()=>toggle(tutor.id)}>
                <div className="tutor-acc-hdr-left">
                  <div className="dot dot-blue"/>
                  <span className="tutor-name">{tutor.name}</span>
                  <span className="tutor-session-count">{tutSessions.length} sessions · {tutAtt} attended</span>
                </div>
                <span style={{color:'var(--text3)',fontSize:'.85rem'}}>{open?'▴':'▾'}</span>
              </div>
              {open && (
                <div className="tutor-acc-body">
                  {tutSessions.map(s => {
                    const student = USERS.find(u=>u.id===s.studentId);
                    return (
                      <div key={s.id} className="admin-session-row" onClick={()=>onSelectSession(s)}>
                        <span className="asr-date">{new Date(s.date+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',weekday:'short'})}</span>
                        <span className="asr-time">{fmtTime(s.startTime)} – {fmtTime(s.endTime)}</span>
                        <span className="asr-student">{student?.name}</span>
                        <span className="asr-instrument">{s.instrument}</span>
                        <span className={statusClass(s.status)}>{s.status}</span>
                        <div className="asr-payroll" onClick={e=>e.stopPropagation()}>
                          <input type="checkbox" className="pay-check" checked={s.payrollTutorPaid}
                            onChange={()=>onTogglePay(s.id,'payrollTutorPaid')} title="Tutor paid"/>
                          <span className="pay-label">Paid</span>
                          <input type="checkbox" className="pay-check" checked={s.paymentReceived}
                            onChange={()=>onTogglePay(s.id,'paymentReceived')} title="Payment received" style={{marginLeft:'.5rem'}}/>
                          <span className="pay-label">Recv'd</span>
                          <input type="checkbox" className="pay-check" checked={s.invoiced}
                            onChange={()=>onTogglePay(s.id,'invoiced')} title="Invoiced" style={{marginLeft:'.5rem'}}/>
                          <span className="pay-label">Inv'd</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

          <div><h2>{title}</h2>{sub&&<p>{sub}</p>}</div>
        </div>
        <button className="btn" onClick={onLogout}>Logout</button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   STUDENT DASHBOARD
══════════════════════════════════════════════════ */
function StudentDashboard({ user, sessions, onLogout, onUpdateSession, onSaveRecording }) {
  const [activeSession, setActiveSession] = useState(null);
  const mySessions = sessions.filter(s=>s.studentId===user.id).sort((a,b)=>a.date.localeCompare(b.date));
  const attended   = mySessions.filter(s=>s.status==='attended').length;
  const upcoming   = mySessions.filter(s=>s.status==='scheduled').length;
  const myTasks    = TASKS.filter(t=>t.studentId===user.id);

  return (
    <div>
      <AppHeader title={`Welcome, ${user.name}!`} sub="Student Dashboard" onLogout={onLogout}/>
      <div className="dashboard">
        <div className="stats-grid">
          {[['Sessions Attended',attended,'var(--green)'],['Upcoming',upcoming,null],['Tasks',myTasks.length,null],['Completed',myTasks.filter(t=>t.status==='completed').length,'var(--green)']].map(([l,v,c])=>(
            <div key={l} className="stat-card">
              <div className="stat-val" style={c?{color:c}:{}}>{v}</div>
              <div className="stat-lbl">{l}</div>
            </div>
          ))}
        </div>

        <AttendanceCalendar sessions={mySessions} userRole="student" currentUserId={user.id} onSelectSession={setActiveSession}/>

        {/* Upcoming sessions quick list */}
        {upcoming > 0 && (
          <div className="card">
            <div className="card-hdr"><div className="card-title">Upcoming Sessions</div></div>
            {mySessions.filter(s=>s.status==='scheduled').map(s=>(
              <div key={s.id} className="task-item" style={{cursor:'pointer'}} onClick={()=>setActiveSession(s)}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.4rem'}}>
                  <div className="task-title">{fmtDate(s.date)} · {fmtTime(s.startTime)}</div>
                  <span className={statusClass(s.status)}>{s.status}</span>
                </div>
                <div className="task-desc">{s.instrument} · {s.durationMin} min · {userName(s.tutorId)}</div>
                {s.plannedSummary && <div style={{fontSize:'.82rem',color:'var(--text3)',marginTop:'.3rem'}}>{s.plannedSummary}</div>}
              </div>
            ))}
          </div>
        )}

        {/* Tasks */}
        <div className="card">
          <div className="card-hdr"><div className="card-title">Practice Tasks</div></div>
          {myTasks.map(t=>(
            <div key={t.id} className="task-item">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'.3rem'}}>
                <div className="task-title">{t.title}</div>
                <span className={`badge badge-${t.status==='completed'?'complete':t.status==='in-progress'?'progress':'pending'}`}>{t.status}</span>
              </div>
              <div className="task-desc">{t.description}</div>
              <div style={{fontSize:'.78rem',color:'var(--text3)'}}>Due: {t.dueDate}</div>
            </div>
          ))}
        </div>
      </div>

      {activeSession && (
        <SessionPanel
          session={activeSession}
          userRole="student"
          currentUserId={user.id}
          onClose={()=>setActiveSession(null)}
          onSaveRecording={onSaveRecording}
          onUpdateSession={onUpdateSession}
          onMarkStatus={()=>{}}
        />
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   PARENT DASHBOARD
══════════════════════════════════════════════════ */
function ParentDashboard({ user, sessions, onLogout }) {
  const [activeSession, setActiveSession] = useState(null);
  const childIds     = user.childIds || [];
  const childSessions= sessions.filter(s=>childIds.includes(s.studentId)).sort((a,b)=>a.date.localeCompare(b.date));
  const child        = USERS.find(u=>childIds.includes(u.id));
  const attended     = childSessions.filter(s=>s.status==='attended').length;
  const missed       = childSessions.filter(s=>s.status==='missed').length;
  const total        = attended + missed;
  const rate         = total > 0 ? Math.round(attended/total*100) : null;

  return (
    <div>
      <AppHeader title="Parent Dashboard" sub={`${child?.name}'s Progress`} onLogout={onLogout}/>
      <div className="dashboard">
        <div className="stats-grid">
          {[['Sessions',attended,'var(--green)'],['Missed',missed,missed>0?'var(--red)':null],['Upcoming',childSessions.filter(s=>s.status==='scheduled').length,null],['Attendance Rate',rate!==null?rate+'%':'—',null]].map(([l,v,c])=>(
            <div key={l} className="stat-card">
              <div className="stat-val" style={c?{color:c}:{}}>{v}</div>
              <div className="stat-lbl">{l}</div>
            </div>
          ))}
        </div>

        <AttendanceCalendar sessions={childSessions} userRole="parent" currentUserId={user.id} onSelectSession={setActiveSession}/>

        <div className="card">
          <div className="card-hdr"><div className="card-title">Session History</div></div>
          {[...childSessions].reverse().slice(0,8).map(s=>(
            <div key={s.id} className="task-item" style={{cursor:'pointer'}} onClick={()=>setActiveSession(s)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.35rem'}}>
                <div className="task-title">{fmtDate(s.date)}</div>
                <span className={statusClass(s.status)}>{s.status}</span>
              </div>
              <div className="task-desc">{s.instrument} · {s.durationMin} min · {fmtTime(s.startTime)} – {fmtTime(s.endTime)}</div>
              {s.tutorComments && <div style={{fontSize:'.82rem',color:'var(--text2)',marginTop:'.3rem'}}>💬 Tutor note: {s.tutorComments.slice(0,80)}{s.tutorComments.length>80?'…':''}</div>}
            </div>
          ))}
        </div>
      </div>

      {activeSession && (
        <SessionPanel
          session={activeSession}
          userRole="parent"
          currentUserId={user.id}
          onClose={()=>setActiveSession(null)}
          onSaveRecording={()=>{}}
          onUpdateSession={()=>{}}
          onMarkStatus={()=>{}}
        />
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   TUTOR DASHBOARD
══════════════════════════════════════════════════ */
function TutorDashboard({ user, sessions, onLogout, onUpdateSession, onSaveRecording, onMarkStatus, onAddSession }) {
  const [activeSession,  setActiveSession]  = useState(null);
  const [showSchedule,   setShowSchedule]   = useState(false);
  const [filterStudent,  setFilterStudent]  = useState('all');
  const [view,           setView]           = useState('calendar');

  const myStudentIds = [...new Set(sessions.filter(s=>s.tutorId===user.id).map(s=>s.studentId))];
  const myStudents   = USERS.filter(u=>myStudentIds.includes(u.id));

  const mySessions = sessions.filter(s => s.tutorId===user.id && (filterStudent==='all' || s.studentId===parseInt(filterStudent)))
    .sort((a,b)=>a.date.localeCompare(b.date));

  const attended = sessions.filter(s=>s.tutorId===user.id&&s.status==='attended').length;
  const upcoming = sessions.filter(s=>s.tutorId===user.id&&s.status==='scheduled').length;

  return (
    <div>
      <AppHeader title="Tutor Dashboard" sub={`Welcome, ${user.name}`} onLogout={onLogout}/>
      <div className="dashboard">
        <div className="stats-grid">
          {[['My Students',myStudents.length,null],['Sessions Taught',attended,'var(--green)'],['Upcoming',upcoming,null]].map(([l,v,c])=>(
            <div key={l} className="stat-card">
              <div className="stat-val" style={c?{color:c}:{}}>{v}</div>
              <div className="stat-lbl">{l}</div>
            </div>
          ))}
        </div>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
          <div className="cal-filter">
            <button className={`filter-btn${filterStudent==='all'?' active':''}`} onClick={()=>setFilterStudent('all')}>All Students</button>
            {myStudents.map(s=>(
              <button key={s.id} className={`filter-btn${filterStudent===String(s.id)?' active':''}`} onClick={()=>setFilterStudent(String(s.id))}>{s.name}</button>
            ))}
          </div>
          <div style={{display:'flex',gap:'.5rem'}}>
            <button className={`btn btn-sm${view==='calendar'?' btn-primary':''}`} onClick={()=>setView('calendar')}>Calendar</button>
            <button className={`btn btn-sm${view==='roster'?' btn-primary':''}`} onClick={()=>setView('roster')}>My Schedule</button>
            <button className="btn btn-primary btn-sm" onClick={()=>setShowSchedule(true)}>+ Schedule Session</button>
          </div>
        </div>

        {view==='calendar' ? (
          <AttendanceCalendar sessions={mySessions} userRole="tutor" currentUserId={user.id} onSelectSession={setActiveSession}/>
        ) : (
          <TutorRoster sessions={sessions} currentUserId={user.id} userRole="tutor"/>
        )}

        <div className="card">
          <div className="card-hdr"><div className="card-title">Upcoming Sessions</div></div>
          {mySessions.filter(s=>s.status==='scheduled').map(s=>(
            <div key={s.id} className="task-item" style={{cursor:'pointer'}} onClick={()=>setActiveSession(s)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.4rem'}}>
                <div className="task-title">{fmtDate(s.date)} · {fmtTime(s.startTime)}</div>
                <span className={statusClass(s.status)}>{s.status}</span>
              </div>
              <div className="task-desc">{userName(s.studentId)} · {s.instrument} · {s.durationMin} min</div>
              {s.plannedSummary && <div style={{fontSize:'.82rem',color:'var(--text3)',marginTop:'.3rem'}}>{s.plannedSummary}</div>}
            </div>
          ))}
          {mySessions.filter(s=>s.status==='scheduled').length===0 && (
            <p style={{color:'var(--text3)',fontSize:'.875rem'}}>No upcoming sessions scheduled.</p>
          )}
        </div>
      </div>

      {activeSession && (
        <SessionPanel
          session={activeSession}
          userRole="tutor"
          currentUserId={user.id}
          onClose={()=>setActiveSession(null)}
          onSaveRecording={onSaveRecording}
          onUpdateSession={onUpdateSession}
          onMarkStatus={onMarkStatus}
        />
      )}
      {showSchedule && (
        <ScheduleModal
          onClose={()=>setShowSchedule(false)}
          onSave={onAddSession}
          currentUserId={user.id}
          userRole="tutor"
        />
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   ADMIN DASHBOARD
══════════════════════════════════════════════════ */
function AdminDashboard({ user, sessions, onLogout, onUpdateSession, onSaveRecording, onMarkStatus, onAddSession, onTogglePay }) {
  const [activeSession, setActiveSession] = useState(null);
  const [showSchedule,  setShowSchedule]  = useState(false);
  const [filterStudent, setFilterStudent] = useState('all');
  const [view, setView]                   = useState('calendar'); // 'calendar' | 'list'

  const students = USERS.filter(u=>u.role==='student').sort((a,b)=>a.name.split(' ').pop().localeCompare(b.name.split(' ').pop()));
  const visibleSessions = sessions.filter(s => filterStudent==='all' || s.studentId===parseInt(filterStudent));

  const attended = sessions.filter(s=>s.status==='attended').length;
  const missed   = sessions.filter(s=>s.status==='missed').length;
  const revenue  = sessions.filter(s=>s.paymentReceived).length;
  const unpaid   = sessions.filter(s=>s.status==='attended'&&!s.payrollTutorPaid).length;

  return (
    <div>
      <AppHeader title="Admin Dashboard" sub={`Welcome, ${user.name}`} onLogout={onLogout}/>
      <div className="dashboard">
        <div className="stats-grid">
          {[
            ['Total Sessions',sessions.length,null],
            ['Attended',attended,'var(--green)'],
            ['Missed',missed,missed>0?'var(--red)':null],
            ['Payments Received',revenue,null],
            ['Tutor Pay Pending',unpaid,unpaid>0?'var(--amber)':null]
          ].map(([l,v,c])=>(
            <div key={l} className="stat-card">
              <div className="stat-val" style={c?{color:c}:{}}>{v}</div>
              <div className="stat-lbl">{l}</div>
            </div>
          ))}
        </div>

        {/* toolbar */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap',gap:'.75rem'}}>
          <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap',alignItems:'center'}}>
            <div className="cal-filter" style={{margin:0}}>
              <button className={`filter-btn${filterStudent==='all'?' active':''}`} onClick={()=>setFilterStudent('all')}>All Students</button>
              {students.map(s=>(
                <button key={s.id} className={`filter-btn${filterStudent===String(s.id)?' active':''}`} onClick={()=>setFilterStudent(String(s.id))}>{s.name}</button>
              ))}
            </div>
          </div>
          <div style={{display:'flex',gap:'.5rem'}}>
            <button className={`btn btn-sm${view==='calendar'?' btn-primary':''}`} onClick={()=>setView('calendar')}>Calendar</button>
            <button className={`btn btn-sm${view==='list'?' btn-primary':''}`} onClick={()=>setView('list')}>Day List</button>
            <button className={`btn btn-sm${view==='roster'?' btn-primary':''}`} onClick={()=>setView('roster')}>Tutor Roster</button>
            <button className="btn btn-primary btn-sm" onClick={()=>setShowSchedule(true)}>+ Schedule</button>
          </div>
        </div>

        {view==='calendar' ? (
          <AttendanceCalendar sessions={visibleSessions} userRole="admin" currentUserId={user.id} onSelectSession={setActiveSession}/>
        ) : view==='list' ? (
          <AdminDayView sessions={visibleSessions} onSelectSession={setActiveSession} onTogglePay={onTogglePay}/>
        ) : (
          <TutorRoster sessions={sessions} currentUserId={user.id} userRole="admin"/>
        )}
      </div>

      {activeSession && (
        <SessionPanel
          session={activeSession}
          userRole="admin"
          currentUserId={user.id}
          onClose={()=>setActiveSession(null)}
          onSaveRecording={onSaveRecording}
          onUpdateSession={onUpdateSession}
          onMarkStatus={onMarkStatus}
        />
      )}
      {showSchedule && (
        <ScheduleModal
          onClose={()=>setShowSchedule(false)}
          onSave={onAddSession}
          currentUserId={user.id}
          userRole="admin"
        />
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════════ */
function App() {
  const [currentUser,  setUser]     = useState(null);
  const [loginType,    setLogin]    = useState(null);
  const [sessions,     setSessions] = useState(initSessions);

  function updateSession(id, patch) {
    setSessions(prev => prev.map(s => s.id===id ? {...s,...patch} : s));
  }
  function saveRecording(sessionId, rec) {
    setSessions(prev => prev.map(s => s.id===sessionId ? {...s, recordings:[...s.recordings, rec]} : s));
  }
  function markStatus(sessionId, status) {
    setSessions(prev => prev.map(s => s.id===sessionId ? {...s, status} : s));
  }
  function addSession(s) {
    setSessions(prev => [...prev, s]);
  }
  function togglePay(sessionId, field) {
    setSessions(prev => prev.map(s => s.id===sessionId ? {...s, [field]:!s[field]} : s));
  }

  const logout = () => { setUser(null); setLogin(null); };

  if (!loginType)   return <LandingPage onSelectLogin={setLogin}/>;
  if (!currentUser) return <LoginScreen onLogin={setUser} userType={loginType} onBack={()=>setLogin(null)}/>;

  const role = currentUser.role;
  const sharedProps = { sessions, onLogout:logout, onUpdateSession:updateSession, onSaveRecording:saveRecording, onMarkStatus:markStatus, onAddSession:addSession };

  if (role==='student') return <StudentDashboard user={currentUser} {...sharedProps}/>;
  if (role==='parent')  return <ParentDashboard  user={currentUser} sessions={sessions} onLogout={logout}/>;
  if (role==='tutor')   return <TutorDashboard   user={currentUser} {...sharedProps}/>;
  if (role==='admin')   return <AdminDashboard   user={currentUser} {...sharedProps} onTogglePay={togglePay}/>;

  return null;
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
